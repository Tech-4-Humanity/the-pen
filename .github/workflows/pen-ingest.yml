name: PEN Ingest Worker

on:
  push:
    branches: [main, dev]
    paths:
      - 'inbox/**'
      - 'tools/pen/**'
      - '.github/workflows/pen-ingest.yml'
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      idempotency_key:
        description: 'Optional idempotency key filter'
        required: false
        type: string

permissions:
  contents: write

jobs:
  ingest:
    name: Ingest PEN inbox and write receipts
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: true

      - name: Debug context
        run: |
          set -uo pipefail
          echo "REF: $GITHUB_REF  SHA: $GITHUB_SHA  EVENT: $GITHUB_EVENT_NAME"
          echo "=== inbox files ==="
          find inbox -maxdepth 1 -name '*.json' 2>/dev/null | sort || echo "(no inbox dir)"
          echo "=== tools/pen ==="
          ls -la tools/pen/ 2>/dev/null || echo "(no tools/pen dir)"

      - name: Check for inbox work
        id: inbox
        run: |
          set -uo pipefail
          shopt -s nullglob
          FILES=(inbox/*.json)
          COUNT=${#FILES[@]}
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          if [ "$COUNT" -eq 0 ]; then
            echo "inbox is empty - nothing to ingest, will exit clean"
          fi

      - name: Empty-inbox annotation
        if: steps.inbox.outputs.count == '0'
        run: echo "PEN Ingest: Empty inbox - no work to do"

      - name: Setup Node
        if: steps.inbox.outputs.count != '0'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify worker script exists
        if: steps.inbox.outputs.count != '0'
        id: verify_worker
        run: |
          if [ -f tools/pen/pen_ingest_worker.mjs ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "tools/pen/pen_ingest_worker.mjs missing - skipping"
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run PEN worker
        if: steps.inbox.outputs.count != '0' && steps.verify_worker.outputs.present == 'true'
        continue-on-error: true
        env:
          PEN_ROOT: ${{ github.workspace }}
          PEN_WORKER_ID: github-actions/pen-ingest
          PEN_IDEMPOTENCY_KEY: ${{ github.event.inputs.idempotency_key || '' }}
          PEN_ENV: ${{ github.ref_name == 'main' && 'production' || 'dev' }}
          BRIDGE_ROOT: ${{ github.workspace }}
          BRIDGE_WORKER_ID: github-actions/pen-ingest
          BRIDGE_IDEMPOTENCY_KEY: ${{ github.event.inputs.idempotency_key || '' }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -uo pipefail
          node tools/pen/pen_ingest_worker.mjs 2>&1 | tee pen-ingest-summary.json || {
            echo "worker exited non-zero - continuing to commit any partial output"
            exit 0
          }

      - name: Commit receipts
        if: steps.inbox.outputs.count != '0'
        run: |
          set -uo pipefail
          git config user.name  "pen-ingest-bot"
          git config user.email "pen-ingest-bot@users.noreply.github.com"
          mkdir -p receipts/runtime
          git add receipts/runtime pen-ingest-summary.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No new receipts to commit"
            exit 0
          fi
          git commit -m "write PEN runtime receipts [${{ github.ref_name }}]"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
          git push

      - name: Print receipt summary
        if: steps.inbox.outputs.count != '0' && always()
        run: |
          if [ -f pen-ingest-summary.json ]; then
            cat pen-ingest-summary.json
          else
            echo "no summary produced"
          fi
