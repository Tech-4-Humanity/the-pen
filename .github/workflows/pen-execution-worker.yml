name: Pen Execution Worker

on:
  workflow_dispatch:
    inputs:
      task_id:
        description: Task ID to execute
        required: true
        default: inbox-dispatch
      mode:
        description: Execution mode
        required: true
        default: execute
        type: choice
        options:
          - dry_run
          - execute
      env:
        description: Target environment
        required: false
        default: production
        type: choice
        options:
          - production
          - dev
      issue_number:
        description: GitHub issue number to receive the execution receipt comment
        required: false
        default: '110'
  push:
    branches: [main, dev]
    paths:
      - 'inbox/**'
      - 'tasks/**'
      - 'system/**'
      - 'prompts/**'
      - 'scripts/**'
      - '.github/workflows/pen-execution-worker.yml'

permissions:
  contents: write
  issues: write

concurrency:
  group: pen-execution-worker
  cancel-in-progress: false

env:
  RECEIPT_DIR: receipts/runtime
  OUTPUT_DIR: outputs/runtime

jobs:
  execute:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Debug context
        run: |
          echo "REF: $GITHUB_REF  BRANCH: ${{ github.ref_name }}"
          echo "=== inbox files ==="
          find inbox -maxdepth 1 -name '*.json' | sort || echo "(none)"

      - name: Verify executor script exists
        run: |
          if [ ! -f scripts/pen-executor.mjs ]; then
            echo "ERROR: scripts/pen-executor.mjs not found"
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Execute Pen task
        id: pen_execute
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          BRIDGE_ENDPOINT: ${{ secrets.BRIDGE_ENDPOINT }}
          BRIDGE_KEY: ${{ secrets.BRIDGE_KEY }}
          GH_PAT: ${{ secrets.GH_PAT }}
          PEN_ENV: ${{ github.event.inputs.env || (github.ref_name == 'main' && 'production' || 'dev') }}
        run: |
          node scripts/pen-executor.mjs "${{ github.event.inputs.task_id || 'inbox-dispatch' }}" "${{ github.event.inputs.mode || 'execute' }}"

      - name: Commit runtime artefacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add receipts outputs runtime inbox || true
          if git diff --cached --quiet; then
            echo "No runtime artefacts to commit"
          else
            git commit -m "pen-execution receipt [${{ github.ref_name }}]"
            for attempt in 1 2 3; do
              if git push; then exit 0; fi
              git fetch origin main
              git rebase origin/main || { git rebase --abort || true; exit 1; }
            done
            exit 1
          fi

      - name: Add issue receipt comment
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            console.log('receipt comment phase');