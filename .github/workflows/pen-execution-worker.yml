name: Pen Execution Worker

on:
  workflow_dispatch:
    inputs:
      task_id:
        description: Task ID to execute
        required: true
        default: inbox-dispatch
      mode:
        description: Execution mode
        required: true
        default: execute
        type: choice
        options:
          - dry_run
          - execute
      env:
        description: Target environment
        required: false
        default: production
        type: choice
        options:
          - production
          - dev
      issue_number:
        description: GitHub issue number to receive the execution receipt comment
        required: false
        default: '110'
  push:
    branches: [main, dev]
    paths:
      - 'inbox/**'
      - 'tasks/**'
      - 'system/**'
      - 'prompts/**'
      - 'scripts/**'
      - '.github/workflows/pen-execution-worker.yml'

permissions:
  contents: write
  issues: write

env:
  RECEIPT_DIR: receipts/runtime
  OUTPUT_DIR: outputs/runtime

jobs:
  execute:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: true

      - name: Debug context
        run: |
          echo "REF: $GITHUB_REF  BRANCH: ${{ github.ref_name }}"
          echo "=== inbox files ==="
          find inbox -maxdepth 1 -name '*.json' | sort || echo "(none)"

      - name: Verify executor script exists
        run: |
          if [ ! -f scripts/pen-executor.mjs ]; then
            echo "ERROR: scripts/pen-executor.mjs not found"
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Execute Pen task
        id: pen_execute
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          BRIDGE_ENDPOINT: ${{ secrets.BRIDGE_ENDPOINT }}
          BRIDGE_KEY: ${{ secrets.BRIDGE_KEY }}
          GH_PAT: ${{ secrets.GH_PAT }}
          PEN_ENV: ${{ github.event.inputs.env || (github.ref_name == 'main' && 'production' || 'dev') }}
        run: |
          node scripts/pen-executor.mjs \
            "${{ github.event.inputs.task_id || 'inbox-dispatch' }}" \
            "${{ github.event.inputs.mode || 'execute' }}"

      - name: Commit runtime artefacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add receipts outputs || true
          if git diff --cached --quiet; then
            echo "No runtime artefacts to commit"
          else
            git commit -m "pen-execution receipt [${{ github.ref_name }}]"
            git push
          fi

      - name: Add issue receipt comment
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            function readJson(p) {
              try { return JSON.parse(fs.readFileSync(p, 'utf8')); }
              catch { return null; }
            }

            const latestPath = fs.existsSync('receipts/runtime/latest.json') ? 'receipts/runtime/latest.json' : null;
            const latest = latestPath ? readJson(latestPath) : null;

            let issueNumber = Number('${{ github.event.inputs.issue_number || '' }}');
            if (!issueNumber && latest?.target_issue) issueNumber = Number(latest.target_issue);
            if (!issueNumber && latest?.source_issue) {
              const match = String(latest.source_issue).match(/issues\/(\d+)/);
              if (match) issueNumber = Number(match[1]);
            }
            if (!issueNumber) issueNumber = 110;

            const body = latestPath && latest
              ? [
                  'Pen Execution Worker completed.',
                  '',
                  `Latest receipt: ${latestPath}`,
                  `Status: ${latest.status}`,
                  `Reality: ${latest.reality_classification || latest.reality || 'UNKNOWN'}`,
                  `Task: ${latest.task_id || 'UNKNOWN'}`,
                  '',
                  'This comment was posted to the source issue selected by workflow input or receipt metadata, not hard-coded to issue #5.'
                ].join('\n')
              : 'Pen Execution Worker ran but no latest receipt was found.';

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body
            });
