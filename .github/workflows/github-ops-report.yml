name: GitHub Ops Report

# Scheduled execution is temporarily removed while GitHub-hosted runners are
# blocked at the account billing/spend-control layer. Keep manual dispatch for
# validation after the portable T4H runtime owns the schedule or billing clears.
on:
  workflow_dispatch:
    inputs:
      target_repos:
        description: 'Comma-separated repo list (defaults to all TML-4PM repos)'
        required: false
        type: string

permissions:
  contents: write
  issues: read
  actions: read
  pull-requests: read

concurrency:
  group: github-ops-report-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ops-report:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run GitHub Actions Ledger
        env:
          # Prefer GH_PAT for cross-repo visibility; fall back to the runtime GITHUB_TOKEN.
          GH_PAT: ${{ secrets.GH_PAT }}
          GITHUB_TOKEN: ${{ secrets.GH_PAT || github.token }}
          GITHUB_OWNER: TML-4PM
          TARGET_REPOS: ${{ github.event.inputs.target_repos || '' }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          node scripts/github-actions-ledger.mjs

      - name: Commit report and receipt
        if: always()
        env:
          RUN_ID: ${{ github.run_id }}
          EVENT_NAME: ${{ github.event_name }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p receipts/runtime reports/github-ops
          cat > receipts/runtime/github-ops-report-${RUN_ID}.receipt.json <<EOF
          {
            "system": "github_ops_report",
            "workflow_run_id": "${RUN_ID}",
            "workflow_run_url": "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}",
            "status": "${JOB_STATUS}",
            "timestamp_utc": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "trigger": "${EVENT_NAME}"
          }
          EOF
          git add reports/github-ops/ receipts/runtime/
          if git diff --staged --quiet; then
            echo "No report or receipt changes"
            exit 0
          fi
          git commit -m "ops-report: $(date -u +%Y-%m-%d) GitHub Actions ledger [skip ci]"
          for attempt in 1 2 3 4 5; do
            if git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push; then
              exit 0
            fi
            echo "push attempt ${attempt} failed; retrying after rebase"
            sleep $((RANDOM % 8 + 2))
          done
          echo "::warning::github ops report push failed after retries; report generated but not pushed"
