name: AGL Bootstrap

on:
  schedule:
    - cron: '0 0 * * *'   # daily midnight UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: DDL + seed
        id: ddl
        continue-on-error: true
        run: |
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST "${{ secrets.BRIDGE_ENDPOINT }}" \
            -H "Content-Type: application/json" \
            -H "x-api-key: ${{ secrets.BRIDGE_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.BRIDGE_KEY }}" \
            -d '{
              "fn": "troy-sql-executor",
              "sql": "CREATE UNIQUE INDEX IF NOT EXISTS idx_work_dedupe ON ops.work_queue (idempotency_key); CREATE SCHEMA IF NOT EXISTS core; CREATE TABLE IF NOT EXISTS core.widgets (widget_id text PRIMARY KEY, category text, status text, created_at timestamptz default now()); INSERT INTO core.widgets (widget_id, category, status) VALUES ('"'"'bridge_runner_control_plane'"'"', '"'"'control_plane'"'"', '"'"'active'"'"') ON CONFLICT (widget_id) DO NOTHING;",
              "debug": true
            }')
          HTTP=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | head -n -1)
          echo "ddl_status=$HTTP" >> $GITHUB_OUTPUT
          echo "ddl_body=$BODY" >> $GITHUB_OUTPUT
          echo "Bridge responded: HTTP $HTTP"

      - name: Verify
        id: verify
        continue-on-error: true
        run: |
          RESPONSE=$(curl -s -X POST "${{ secrets.BRIDGE_ENDPOINT }}" \
            -H "Content-Type: application/json" \
            -H "x-api-key: ${{ secrets.BRIDGE_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.BRIDGE_KEY }}" \
            -d '{
              "fn": "troy-sql-executor",
              "sql": "SELECT '"'"'widgets'"'"' AS tbl, count(*)::text AS n FROM core.widgets WHERE widget_id='"'"'bridge_runner_control_plane'"'"' UNION ALL SELECT '"'"'work_queue'"'"', count(*)::text FROM ops.work_queue UNION ALL SELECT '"'"'audit_log'"'"', count(*)::text FROM audit.log;",
              "debug": true
            }')
          echo "verify=$RESPONSE" >> $GITHUB_OUTPUT

      - name: Write receipt
        run: |
          mkdir -p receipts/agl
          cat > receipts/agl/bootstrap-$(date +%Y-%m-%d).json << RECEIPT
          {
            "at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "ddl_status": "${{ steps.ddl.outputs.ddl_status }}",
            "actor": "github-actions",
            "source": "agl-bootstrap"
          }
          RECEIPT
          cp receipts/agl/bootstrap-$(date +%Y-%m-%d).json receipts/agl/latest.json

      - name: Commit receipt
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add receipts/agl
          git diff --cached --quiet || git commit -m "AGL bootstrap receipt $(date +%Y-%m-%d)" && git push
