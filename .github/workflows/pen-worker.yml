name: pen-worker

on:
  push:
    paths:
      - 'inbox/*.json'
      - 'workers/**'
      - 'schemas/**'
      - 'templates/**'
      - 'docs/**'
      - '.github/workflows/pen-worker.yml'
  workflow_dispatch:
    inputs:
      job_path:
        description: 'Path to inbox job JSON'
        required: false
        default: ''

permissions:
  contents: write
  actions: read

concurrency:
  group: pen-worker-${{ github.ref }}
  cancel-in-progress: false

jobs:
  run-pen-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PEN_RECEIPTS_DIR: receipts/runtime
      PEN_INBOX_DIR: inbox
      BRIDGE_INVOKE_URL: ${{ secrets.BRIDGE_ENDPOINT }}
      BRIDGE_API_KEY: ${{ secrets.BRIDGE_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r workers/requirements.txt

      - name: Resolve job path
        id: job
        shell: bash
        run: |
          set -euo pipefail
          JOB_PATH=""
          if [ -n "${{ github.event.inputs.job_path || '' }}" ]; then
            JOB_PATH="${{ github.event.inputs.job_path }}"
          else
            JOB_PATH=$(git diff --name-only HEAD~1 HEAD 2>/dev/null | grep '^inbox/.*\.json$' | head -n 1 || true)
            if [ -z "$JOB_PATH" ]; then
              # Only consider top-level inbox/*.json; subdirectory jobs are dispatched by Pen Inbox Dispatch + Execute, not this worker
              JOB_PATH=$(ls -1t inbox/*.json 2>/dev/null | head -n 1 || true)
            fi
          fi
          if [ -z "$JOB_PATH" ] || [ ! -f "$JOB_PATH" ]; then
            echo "No top-level inbox/*.json job to process for this push — exiting cleanly."
            echo "has_job=false" >> "$GITHUB_OUTPUT"
            echo "job_path=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "has_job=true" >> "$GITHUB_OUTPUT"
          echo "job_path=$JOB_PATH" >> "$GITHUB_OUTPUT"
          echo "Resolved job path: $JOB_PATH"

      - name: Run Pen worker
        if: steps.job.outputs.has_job == 'true'
        id: worker
        run: |
          python workers/pen_worker.py --job "${{ steps.job.outputs.job_path }}" --receipts-dir "$PEN_RECEIPTS_DIR"

      - name: Commit receipt
        if: steps.job.outputs.has_job == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "pen-worker"
          git config user.email "pen-worker@users.noreply.github.com"
          git add receipts/runtime/*.receipt.json
          if git diff --cached --quiet; then
            echo "No new receipt to commit; likely idempotent replay."
          else
            git commit -m "receipt: pen worker execution [skip ci]"
            n=0
            until [ $n -ge 5 ]; do
              git pull --rebase --autostash origin main && git push && break
              n=$((n+1)); echo "push retry $n..."; sleep $((RANDOM % 5 + 1))
            done
          fi

      - name: Summary
        if: steps.job.outputs.has_job == 'true'
        shell: bash
        run: |
          echo "## Pen worker" >> "$GITHUB_STEP_SUMMARY"
          echo "Job: ${{ steps.job.outputs.job_path }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Receipts:" >> "$GITHUB_STEP_SUMMARY"
          ls -1 receipts/runtime/*.receipt.json | tail -n 10 >> "$GITHUB_STEP_SUMMARY"

      - name: No-job summary
        if: steps.job.outputs.has_job != 'true'
        shell: bash
        run: |
          echo "## Pen worker — no job" >> "$GITHUB_STEP_SUMMARY"
          echo "Push triggered the workflow but contained no top-level inbox/*.json. Exited cleanly." >> "$GITHUB_STEP_SUMMARY"
