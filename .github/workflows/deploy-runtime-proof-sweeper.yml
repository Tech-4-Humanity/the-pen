name: Deploy troy-runtime-proof-sweeper

on:
  push:
    paths:
      - 'lambdas/troy-runtime-proof-sweeper/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Zip Lambda
        run: |
          cd lambdas/troy-runtime-proof-sweeper
          zip -j lambda.zip handler.py

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-2

      - name: Create or update Lambda
        run: |
          FUNCTION_NAME=troy-runtime-proof-sweeper
          REGION=ap-southeast-2
          ROLE=arn:aws:iam::140548542136:role/lambda-execution-role
          ZIP=lambdas/troy-runtime-proof-sweeper/lambda.zip

          if aws lambda get-function --function-name $FUNCTION_NAME --region $REGION 2>/dev/null; then
            echo "Updating existing Lambda..."
            aws lambda update-function-code \
              --function-name $FUNCTION_NAME \
              --zip-file fileb://$ZIP \
              --region $REGION
            aws lambda wait function-updated \
              --function-name $FUNCTION_NAME \
              --region $REGION
          else
            echo "Creating new Lambda..."
            aws lambda create-function \
              --function-name $FUNCTION_NAME \
              --runtime python3.11 \
              --role $ROLE \
              --handler handler.lambda_handler \
              --timeout 60 \
              --memory-size 256 \
              --zip-file fileb://$ZIP \
              --region $REGION
            aws lambda wait function-active \
              --function-name $FUNCTION_NAME \
              --region $REGION
          fi

      - name: Set environment variables
        run: |
          aws lambda update-function-configuration \
            --function-name troy-runtime-proof-sweeper \
            --environment "Variables={SUPABASE_URL=${{ secrets.SUPABASE_URL }},SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}}" \
            --region ap-southeast-2

      - name: Set concurrency
        run: |
          aws lambda put-function-concurrency \
            --function-name troy-runtime-proof-sweeper \
            --reserved-concurrent-executions 10 \
            --region ap-southeast-2

      - name: Verify deployment
        run: |
          aws lambda get-function \
            --function-name troy-runtime-proof-sweeper \
            --region ap-southeast-2 \
            --query 'Configuration.[FunctionName,State,LastUpdateStatus]'
