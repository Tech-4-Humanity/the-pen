name: OIKOS Mail Operations Validation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'managed_mcp/migadu/oikos_mail_os/**'
      - '.github/workflows/oikos-mail-os-validation.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Validate registry and run repeatable tests
        run: |
          chmod +x managed_mcp/migadu/oikos_mail_os/deploy.sh
          RECEIPT_DIR="$RUNNER_TEMP/oikos-mail-os-receipts" \
            managed_mcp/migadu/oikos_mail_os/deploy.sh --dry-run
      - name: Validate PostgreSQL schema syntax
        uses: ikalnytskyi/action-setup-postgres@v7
        with:
          postgres-version: '16'
      - name: Apply schema to disposable PostgreSQL
        run: |
          createdb oikos_mail_os_test
          psql oikos_mail_os_test -v ON_ERROR_STOP=1 -f managed_mcp/migadu/oikos_mail_os/schema.sql
          test "$(psql oikos_mail_os_test -Atc 'select count(*) from mail_registry_tables')" -ge 10
      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oikos-mail-os-validation-evidence
          path: ${{ runner.temp }}/oikos-mail-os-receipts
          if-no-files-found: warn
