name: Bridge Runner — Heartbeat

on:
  schedule:
    # freq cut 2026-05-29: */15 -> hourly (kernel: cost_growth_requires_justification). Revert to '*/15 * * * *' if needed.
    - cron: '0 * * * *'
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/bridge-runner-heartbeat.yml'

# pull_request trigger REMOVED — GitHub withholds repo secrets on PR context
# runs, causing 0s startup failures. Heartbeat runs on schedule + dispatch only.

permissions:
  contents: write

concurrency:
  group: bridge-runner-heartbeat-${{ github.ref }}
  cancel-in-progress: false

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Write heartbeat
        env:
          GH_SHA: ${{ github.sha }}
          GH_REPO: ${{ github.repository }}
          GH_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          mkdir -p bridge/receipts
          ISO=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          cat > bridge/receipts/runner-heartbeat.json <<EOF
          {
            "type": "heartbeat",
            "runner": "github-actions",
            "timestamp": "${ISO}",
            "repo": "${GH_REPO}",
            "status": "ALIVE",
            "commit_sha": "${GH_SHA}",
            "run_id": "${GH_RUN_ID}"
          }
          EOF

      - name: Commit heartbeat
        run: |
          set -euo pipefail
          git config user.name  "bridge-runner[bot]"
          git config user.email "bridge-runner@tml-4pm"
          git add bridge/receipts/runner-heartbeat.json
          if git diff --staged --quiet; then
            echo "No heartbeat change — ok"
            exit 0
          fi
          TS=$(date -u +%Y%m%dT%H%M%S)
          git commit -m "chore: runner heartbeat [skip ci] ${TS}"
          for attempt in 1 2 3 4 5; do
            if git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push; then
              exit 0
            fi
            git rebase --abort || true
            echo "push attempt ${attempt} rejected; retrying after clean rebase"
            sleep $((RANDOM % 8 + 2))
          done
          echo "::warning::heartbeat push failed after 5 rebase-retry attempts (non-fatal)"
