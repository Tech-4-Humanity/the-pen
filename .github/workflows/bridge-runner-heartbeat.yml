name: Bridge Runner — Heartbeat

on:
  workflow_dispatch:

# EMERGENCY CONTAINMENT 2026-05-23:
# push and schedule triggers disabled while cross-repo GitHub Actions pre-step failures are active.
# This prevents heartbeat from committing and retriggering itself during the incident.

permissions:
  contents: read

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Heartbeat canary
        run: echo bridge-runner-heartbeat-canary-ok
