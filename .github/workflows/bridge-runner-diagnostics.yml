name: Bridge Runner — Diagnostics

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/bridge-runner-diagnostics.yml'
  schedule:
    - cron: '0 */6 * * *'

# pull_request trigger REMOVED — GitHub withholds repo secrets on PR context
# runs, causing 0s startup failures (PRE_RUNTIME_0S / PR_CONTEXT_SECRET_WITHHELD).
# Use workflow_dispatch, push, or schedule triggers only.

permissions:
  contents: write

concurrency:
  group: bridge-runner-diagnostics-${{ github.ref }}
  cancel-in-progress: false

jobs:
  diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Run diagnostics
        env:
          BRIDGE_ENDPOINT: ${{ secrets.BRIDGE_ENDPOINT }}
          BRIDGE_API_KEY:  ${{ secrets.BRIDGE_API_KEY || secrets.BRIDGE_KEY }}
          SUPABASE_URL:    ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GH_SHA: ${{ github.sha }}
        run: |
          set -uo pipefail
          echo "=== Bridge Runner Diagnostics ==="
          echo "Timestamp: $(date -u)"
          echo "Commit:    ${GH_SHA}"
          echo "Event:     ${{ github.event_name }}"
          echo
          echo "=== Secret Presence ==="
          [ -n "${BRIDGE_ENDPOINT:-}" ]      && echo "BRIDGE_ENDPOINT: SET"      || echo "BRIDGE_ENDPOINT: MISSING"
          [ -n "${BRIDGE_API_KEY:-}" ]       && echo "BRIDGE_API_KEY: SET"       || echo "BRIDGE_API_KEY: MISSING"
          [ -n "${SUPABASE_URL:-}" ]         && echo "SUPABASE_URL: SET"         || echo "SUPABASE_URL: MISSING"
          [ -n "${SUPABASE_SERVICE_KEY:-}" ] && echo "SUPABASE_SERVICE_KEY: SET" || echo "SUPABASE_SERVICE_KEY: MISSING"
          echo
          echo "=== Bridge Connectivity ==="
          if [ -n "${BRIDGE_ENDPOINT:-}" ]; then
            HTTP=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "${BRIDGE_ENDPOINT}" || echo "000")
            echo "HTTP response: $HTTP"
          else
            echo "Skipped — BRIDGE_ENDPOINT not set"
          fi

      - name: Write diagnostic receipt
        env:
          GH_SHA: ${{ github.sha }}
          GH_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          mkdir -p bridge/receipts
          TS=$(date -u +%Y%m%d-%H%M%S)
          ISO=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          RECEIPT="bridge/receipts/diagnostics-${TS}.json"
          cat > "$RECEIPT" <<EOF
          {
            "type": "diagnostics",
            "timestamp": "${ISO}",
            "commit_sha": "${GH_SHA}",
            "run_id": "${GH_RUN_ID}",
            "trigger": "${{ github.event_name }}",
            "status": "RAN"
          }
          EOF
          echo "Wrote: $RECEIPT"

      - name: Commit receipt
        run: |
          set -euo pipefail
          git config user.name  "bridge-runner[bot]"
          git config user.email "bridge-runner@tml-4pm"
          git add bridge/receipts/
          if git diff --staged --quiet; then
            echo "No receipt changes"
            exit 0
          fi
          git commit -m "chore: diagnostics receipt [skip ci]"
          for attempt in 1 2 3 4 5; do
            if git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push; then
              exit 0
            fi
            echo "push attempt ${attempt} rejected; retrying after rebase"
            sleep $((RANDOM % 8 + 2))
          done
          echo "::warning::diagnostic receipt push failed after retries; non-fatal"
