name: Self-Healing Monitor

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      test_mode:
        description: 'Run in test mode without issue creation'
        required: false
        default: 'false'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/self-healing-monitor.yml'
      - 'scripts/**'
      - 'receipts/runtime/**'

# Explicitly exclude pull_request — this workflow must never run in PR context
# (secrets withheld, runner allocation fails, 0s failure noise)
# If triggered via workflow_run from another workflow on a PR, the job-level guard catches it.

permissions:
  contents: write
  issues: write
  actions: write

concurrency:
  group: self-healing-monitor-${{ github.repository }}
  cancel-in-progress: true

jobs:
  detect-and-classify:
    if: |
      github.event_name != 'pull_request' &&
      github.event_name != 'pull_request_target' &&
      (github.event_name != 'workflow_run' || github.event.workflow_run.event != 'pull_request')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Detect failed workflow runs
        id: detect
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          echo "=== Self-Healing Monitor: Detect ==="
          echo "Timestamp: $(date -u)"

          FAILED=$(gh api "/repos/${REPO}/actions/runs?status=completed&per_page=30" \
            --jq --arg current "$CURRENT_RUN_ID" '[.workflow_runs[]
              | select((.conclusion == "failure" or .conclusion == "startup_failure") and (.id|tostring) != $current)
              | {
                id: .id,
                name: .name,
                head_sha: .head_sha,
                branch: .head_branch,
                event: .event,
                created_at: .created_at,
                updated_at: .updated_at,
                run_attempt: .run_attempt,
                html_url: .html_url,
                duration_s: ((.updated_at | fromdateiso8601) - (.created_at | fromdateiso8601))
              }]' 2>/dev/null || echo '[]')

          echo "$FAILED" | python3 -c "
import sys,json
runs=json.load(sys.stdin)
print(f'Failed runs: {len(runs)}')
for r in runs:
    print(f'  - {r[\"name\"]} | run {r[\"id\"]} | {r[\"duration_s\"]}s | branch: {r[\"branch\"]}')
"

          COUNT=$(echo "$FAILED" | python3 -c "import sys,json; print(len(json.load(sys.stdin)))")
          echo "incident_count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "has_incidents=$([ "$COUNT" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

          mkdir -p bridge/receipts
          echo "$FAILED" > /tmp/failed_runs.json

          python3 << 'PYEOF'
import json, os
from datetime import datetime, timezone

with open('/tmp/failed_runs.json') as f:
    runs = json.load(f)

def classify(run):
    duration = run.get('duration_s', 999)
    event = run.get('event', '')
    name = run.get('name', '').lower()
    if duration <= 2:
        if event == 'pull_request':
            return 'PR_CONTEXT_SECRET_WITHHELD'
        return 'PRE_RUNTIME_0S'
    if duration <= 10:
        return 'SECRET_OR_ENV_MISSING'
    if 'permission' in name or 'auth' in name:
        return 'PERMISSION_DENIED'
    if 'deploy' in name or 'build' in name:
        return 'APP_RUNTIME_FAILURE'
    return 'UNKNOWN'

incidents = []
seen = set()
for r in runs:
    fingerprint = (r.get('name'), r.get('head_sha'), r.get('branch'), r.get('event'))
    if fingerprint in seen:
        continue
    seen.add(fingerprint)
    c = classify(r)
    incidents.append({
        'run_id': r['id'],
        'name': r['name'],
        'branch': r['branch'],
        'event': r['event'],
        'duration_s': r['duration_s'],
        'classification': c,
        'html_url': r['html_url'],
        'head_sha': r['head_sha'],
        'created_at': r['created_at'],
        'severity': 'CRITICAL' if c in ['PRE_RUNTIME_0S','PR_CONTEXT_SECRET_WITHHELD'] else 'HIGH',
        'fingerprint': '|'.join(str(x) for x in fingerprint)
    })

report = {
    'type': 'self_healing_detection',
    'timestamp': datetime.now(timezone.utc).isoformat(),
    'repo': os.environ.get('REPO', ''),
    'run_id': os.environ.get('GITHUB_RUN_ID', ''),
    'incidents': incidents,
    'incident_count': len(incidents),
    'status': 'INCIDENTS_FOUND' if incidents else 'CLEAN'
}

with open('bridge/receipts/self-healing-detection.json', 'w') as f:
    json.dump(report, f, indent=2)

print(f'Detection complete: {len(incidents)} incidents classified')
for inc in incidents:
    print(f'  [{inc["severity"]}] {inc["classification"]} - {inc["name"]} ({inc["duration_s"]}s)')
PYEOF

      - name: Attempt safe reruns for transient failures
        if: steps.detect.outputs.has_incidents == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TEST_MODE: ${{ github.event.inputs.test_mode || 'false' }}
        run: |
          python3 << 'PYEOF'
import json, subprocess, os

test_mode = os.environ.get('TEST_MODE', 'false') == 'true'
repo = os.environ.get('REPO', '')

with open('bridge/receipts/self-healing-detection.json') as f:
    report = json.load(f)

rerun_classes = {'UNKNOWN', 'APP_RUNTIME_FAILURE'}
reruns = []

for inc in report.get('incidents', []):
    if inc['classification'] in rerun_classes:
        if inc.get('run_attempt', 1) and int(inc.get('run_attempt', 1)) >= 2:
            reruns.append({'run_id': inc['run_id'], 'status': 'skipped: already retried'})
            continue
        if test_mode:
            print(f"[TEST] Would rerun: {inc['run_id']} ({inc['name']})")
            reruns.append({'run_id': inc['run_id'], 'status': 'test_only'})
        else:
            result = subprocess.run([
                'gh', 'api', '--method', 'POST',
                f"/repos/{repo}/actions/runs/{inc['run_id']}/rerun-failed-jobs"
            ], capture_output=True, text=True, env={**os.environ})
            status = 'queued' if result.returncode == 0 else f'failed: {result.stderr[:200]}'
            reruns.append({'run_id': inc['run_id'], 'status': status})
            print(f"Rerun {inc['run_id']}: {status}")

report['reruns'] = reruns
with open('bridge/receipts/self-healing-detection.json', 'w') as f:
    json.dump(report, f, indent=2)
PYEOF

      - name: Create incident issues for critical failures
        if: steps.detect.outputs.has_incidents == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TEST_MODE: ${{ github.event.inputs.test_mode || 'false' }}
        run: |
          python3 << 'PYEOF'
import json, subprocess, os, shlex

test_mode = os.environ.get('TEST_MODE', 'false') == 'true'
repo = os.environ.get('REPO', '')

with open('bridge/receipts/self-healing-detection.json') as f:
    report = json.load(f)

critical = [i for i in report.get('incidents', []) if i.get('severity') == 'CRITICAL']
issues_created = []
issues_skipped = []

for inc in critical:
    marker = f"self-healing-fingerprint:{inc['fingerprint']}"
    search = subprocess.run([
        'gh', 'issue', 'list', '--repo', repo, '--state', 'open', '--search', marker, '--json', 'number,url,title'
    ], capture_output=True, text=True, env={**os.environ})
    existing = []
    if search.returncode == 0 and search.stdout.strip():
        try:
            existing = json.loads(search.stdout)
        except Exception:
            existing = []
    if existing:
        issues_skipped.append({'run_id': inc['run_id'], 'reason': 'existing_open_issue', 'issue': existing[0].get('url')})
        print(f"Existing issue found for {inc['run_id']}: {existing[0].get('url')}")
        continue

    title = f"[AUTO] Workflow failure: {inc['classification']} - {inc['name']}"
    body = f"""## Auto-detected workflow failure

Classification: `{inc['classification']}`
Severity: `{inc['severity']}`
Run: [{inc['run_id']}]({inc['html_url']})
Branch: `{inc['branch']}`
Event: `{inc['event']}`
Duration: {inc['duration_s']}s
SHA: `{inc['head_sha']}`
Detected: {report['timestamp']}

Hidden marker for idempotency: `{marker}`

## Fix

| Class | Cause | Fix |
|---|---|---|
| `PRE_RUNTIME_0S` | Workflow aborted before any step | Check Actions settings, workflow syntax, permissions, secrets |
| `PR_CONTEXT_SECRET_WITHHELD` | Pull-request context withholds privileged execution by design | Use workflow_dispatch or push execution for privileged checks |

## Reality Ledger

```yaml
status: PARTIAL
evidence: GitHub Actions API run {inc['run_id']}
next_action: Verify workflow config, permissions, and runtime dependencies
```

Created automatically by self-healing-monitor. Do not close without receipt.
"""
    if test_mode:
        print(f"[TEST] Would create: {title}")
        issues_created.append({'run_id': inc['run_id'], 'issue': 'test_only'})
    else:
        result = subprocess.run([
            'gh', 'issue', 'create', '--repo', repo,
            '--title', title, '--body', body,
            '--label', 'self-healing', '--label', 'incident'
        ], capture_output=True, text=True, env={**os.environ})
        if result.returncode == 0:
            url = result.stdout.strip()
            issues_created.append({'run_id': inc['run_id'], 'issue': url})
            print(f"Issue created: {url}")
        else:
            print(f"Issue creation failed: {result.stderr[:500]}")

report['issues_created'] = issues_created
report['issues_skipped'] = issues_skipped
with open('bridge/receipts/self-healing-detection.json', 'w') as f:
    json.dump(report, f, indent=2)
print(f"Incident issues created: {len(issues_created)} skipped: {len(issues_skipped)}")
PYEOF

      - name: Commit receipts
        env:
          GH_SHA: ${{ github.sha }}
          GH_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          ISO=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          YYYYMMDD=$(date -u +%Y-%m-%d)
          mkdir -p "bridge/receipts/incidents/${YYYYMMDD}"
          cp bridge/receipts/self-healing-detection.json "bridge/receipts/incidents/${YYYYMMDD}/self-healing-${GH_RUN_ID}.json"
          git config user.name "self-healing-monitor[bot]"
          git config user.email "self-healing@tml-4pm.local"
          git add bridge/receipts/
          if git diff --staged --quiet; then
            echo "No receipt changes"
            exit 0
          fi
          git commit -m "chore: self-healing receipt ${ISO} [skip ci]"
          git pull --rebase --autostash origin main || true
          git push
          echo "Receipt committed."
