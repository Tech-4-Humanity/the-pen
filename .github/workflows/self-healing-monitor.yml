name: Self-Healing Monitor

on:
  workflow_dispatch:
    inputs:
      test_mode:
        description: 'Run in test mode without issue creation'
        required: false
        default: 'true'

# Automatic triggers are quarantined.
# Reason: this workflow repeatedly registered 0s startup failures before any job ran.
# Previous triggers were schedule and push on self-healing-monitor.yml, scripts/**, and receipts/runtime/**.
# Keep manual dispatch only until the monitor body is rebuilt and proven in a networked runner.

permissions:
  contents: read
  issues: read
  actions: read

concurrency:
  group: self-healing-monitor-${{ github.repository }}
  cancel-in-progress: true

jobs:
  quarantine-receipt:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Emit quarantine receipt
        run: |
          set -euo pipefail
          echo "Self-Healing Monitor is quarantined."
          echo "Automatic schedule/push triggers are disabled."
          echo "This manual-only workflow exists to prevent 0s phantom failures while preserving an inspectable Actions entry."
