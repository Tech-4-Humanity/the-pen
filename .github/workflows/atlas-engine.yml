name: Atlas Engine

on:
  pull_request:
    paths:
      - "atlas-engine/**"
      - "workbooks/atlas/**"
      - ".github/workflows/atlas-engine.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: atlas-engine-${{ github.ref }}
  cancel-in-progress: true

jobs:
  normalize-test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: atlas-engine

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: atlas-engine/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Test engine and rejection gates
        run: npm test

      - name: Normalize canonical editorial workbook
        id: normalize
        continue-on-error: true
        run: |
          npm run normalize -- \
            ../workbooks/atlas/T4H_Atlas_Editorial_Progress_Workbook_v1.xlsx \
            data/canonical-atlas.json \
            receipts/normalization-receipt.json

      - name: Compile canonical Atlas
        id: build
        if: steps.normalize.outcome == 'success'
        continue-on-error: true
        run: |
          node compiler/build.mjs data/canonical-atlas.json dist
          cp dist/build-receipt.json receipts/build-receipt.json
          cp dist/build-manifest.json receipts/build-manifest.json

      - name: Write CI summary
        if: always()
        run: |
          mkdir -p receipts
          {
            echo "# Atlas Engine CI"
            echo
            echo "- Tests: completed"
            echo "- Normalize: ${{ steps.normalize.outcome }}"
            echo "- Build: ${{ steps.build.outcome }}"
            echo "- Commit: ${{ github.sha }}"
            echo
            if [ -f receipts/normalization-receipt.json ]; then
              echo "## Normalization receipt"
              echo '```json'
              cat receipts/normalization-receipt.json
              echo '```'
            fi
            if [ -f receipts/build-receipt.json ]; then
              echo "## Build receipt"
              echo '```json'
              cat receipts/build-receipt.json
              echo '```'
            fi
          } | tee receipts/CI_SUMMARY.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload governed receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atlas-engine-receipts-${{ github.run_id }}
          path: |
            atlas-engine/receipts/
            atlas-engine/dist/build-receipt.json
            atlas-engine/dist/build-manifest.json
          if-no-files-found: warn
          retention-days: 30

      - name: Enforce canonical gate
        if: always()
        run: |
          test "${{ steps.normalize.outcome }}" = "success"
          test "${{ steps.build.outcome }}" = "success"
