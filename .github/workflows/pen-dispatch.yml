name: PEN Dispatch (RETIRED — manual state rollup only)

# SUPERSEDED 2026-05-18. This workflow previously ran every 30 minutes and
# dispatched inbox jobs to the bridge with a BROKEN envelope ({idempotency_key,
# job, source, requested_state}) that the bridge cannot parse — producing a
# steady stream of FAILED/PARTIAL receipts and burning Actions minutes for zero
# value (orphan compute / runtime drift under GLOBAL_RULE_KERNEL_V6).
#
# Canonical loop topology is now:
#   1. pen-inbox-dispatch.yml  — PRIMARY. push-triggered on inbox/**, instant,
#                                idempotent, hard-gated, correct flat envelope.
#   2. pen-queue-cron.yml      — SWEEP backstop. */30, correct flat envelope,
#                                idempotent, catches anything the push missed.
#   3. pen-dispatch.yml (this) — RETIRED. No schedule. No bridge dispatch.
#                                Manual-only read-only state-count rollup so the
#                                historical reporting surface is preserved
#                                (archive-never-delete).
#
# Do NOT re-add a schedule or bridge POST here. See docs/PEN_POLLER_LOOP_ARCHITECTURE.md

on:
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  state-rollup:
    name: Read-only state-count rollup (no bridge, no HITL)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Recompute PEN state counts from existing final receipts
        run: |
          set -euo pipefail
          mkdir -p state
          python3 - <<'PY'
          import json, pathlib, os
          from datetime import datetime, timezone
          now = datetime.now(timezone.utc).isoformat()
          final_dir = pathlib.Path('receipts/final')
          counts = {'REAL':0,'PARTIAL':0,'BLOCKED':0,'FAILED':0,'OTHER':0}
          total = 0
          for r in sorted(final_dir.glob('*.json')):
              try:
                  data = json.loads(r.read_text())
              except Exception:
                  counts['OTHER'] += 1; total += 1; continue
              st = (data.get('state') or 'OTHER').upper()
              counts[st if st in counts else 'OTHER'] += 1
              total += 1
          state = {
              'generated_at': now,
              'repo': os.environ.get('GITHUB_REPOSITORY',''),
              'workflow_run_id': os.environ.get('GITHUB_RUN_ID',''),
              'source': 'pen-dispatch RETIRED manual rollup',
              'total_final_receipts': total,
              'counts': counts,
              'note': 'Read-only. Dispatch retired. Primary=pen-inbox-dispatch, Sweep=pen-queue-cron.',
              'autonomous': True, 'hitl': False,
          }
          pathlib.Path('state/pen_state_counts.json').write_text(json.dumps(state, indent=2, sort_keys=True)+'\n')
          md = ['# PEN State Counts','',f'Generated: {now}','',f'Total final receipts: {total}','','| State | Count |','| --- | ---: |']
          for k,v in counts.items(): md.append(f'| {k} | {v} |')
          md += ['','Dispatch workflow RETIRED. Loop topology: see docs/PEN_POLLER_LOOP_ARCHITECTURE.md']
          pathlib.Path('state/pen_state_counts.md').write_text('\n'.join(md)+'\n')
          print(json.dumps(state, indent=2))
          PY

      - name: Commit rollup if changed
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/pen_state_counts.* || true
          if git diff --cached --quiet; then
            echo 'No state-count change.'
          else
            git commit -m "pen-dispatch(retired): manual state rollup"
            git push
          fi
