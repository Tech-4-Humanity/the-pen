name: Actions Runner Diagnostic

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/actions-runner-diagnostic.yml'

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Confirm runner allocation
        run: |
          echo "runner allocated"
          uname -a
          python --version
