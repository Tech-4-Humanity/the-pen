name: Pen Inbox Dispatch + Execute

on:
  pull_request:
    paths:
      - 'inbox/**'
      - '.github/workflows/pen-inbox-dispatch.yml'
  push:
    branches:
      - main
    paths:
      - 'inbox/**'
      - '.github/workflows/pen-inbox-dispatch.yml'
  workflow_dispatch:
    inputs:
      payload_path:
        description: 'Optional inbox payload path to replay, e.g. inbox/example.json'
        required: false
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: pen-inbox-dispatch-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  dispatch-and-execute:
    name: Detect → Execute → Receipt (no HITL)
    runs-on: ubuntu-latest
    env:
      BRIDGE_INVOKE_URL: ${{ secrets.BRIDGE_INVOKE_URL }}
      BRIDGE_API_KEY: ${{ secrets.BRIDGE_API_KEY }}
    steps:
      - name: Always materialise job
        run: |
          echo "Pen Inbox Dispatch job materialised."
          echo "event=${{ github.event_name }}"
          echo "sha=${{ github.sha }}"

      - name: PR-safe acknowledgement
        if: github.event_name == 'pull_request'
        run: |
          echo "Pen Inbox Dispatch required on pull_request."
          echo "Runtime execution disabled for pull_request."
          echo "classification=PR_SAFE_NO_OP"

      - name: Checkout repository
        if: github.event_name != 'pull_request'
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Resolve changed inbox payloads
        if: github.event_name != 'pull_request'
        id: payloads
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p receipts/runtime receipts/final state

          if [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${{ inputs.payload_path }}" ]]; then
            printf '%s\n' "${{ inputs.payload_path }}" > /tmp/payloads.txt
          else
            git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" \
              | grep '^inbox/.*\.json$' > /tmp/payloads.txt || true
          fi

          if [[ ! -s /tmp/payloads.txt ]]; then
            echo "payload_count=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          sort -u /tmp/payloads.txt > /tmp/payloads.sorted.txt
          mv /tmp/payloads.sorted.txt /tmp/payloads.txt
          echo "payload_count=$(wc -l < /tmp/payloads.txt | tr -d ' ')" >> "$GITHUB_OUTPUT"
          echo "Payloads to process:"
          cat /tmp/payloads.txt

      - name: Execute payloads via bridge + write receipts
        if: github.event_name != 'pull_request' && steps.payloads.outputs.payload_count != '0'
        shell: bash
        run: |
          set -euo pipefail
          now=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          python3 - <<'PY'
          import json, pathlib, re, urllib.request, urllib.error, os

          bridge_url = os.environ.get("BRIDGE_INVOKE_URL", "")
          bridge_key = os.environ.get("BRIDGE_API_KEY", "")
          repo      = os.environ.get("GITHUB_REPOSITORY", "")
          sha       = os.environ.get("GITHUB_SHA", "")
          run_id    = os.environ.get("GITHUB_RUN_ID", "")
          now       = __import__("datetime").datetime.utcnow().isoformat() + "Z"

          runtime_dir = pathlib.Path("receipts/runtime")
          final_dir   = pathlib.Path("receipts/final")
          runtime_dir.mkdir(parents=True, exist_ok=True)
          final_dir.mkdir(parents=True, exist_ok=True)

          results = []

          with open("/tmp/payloads.txt") as f:
              paths = [l.strip() for l in f if l.strip()]

          for payload_path_str in paths:
              payload_path = pathlib.Path(payload_path_str)
              key = payload_path.stem

              try:
                  data = json.loads(payload_path.read_text())
                  key  = data.get("idempotency_key") or key
              except Exception as exc:
                  results.append({"key": key, "state": "FAILED", "error": f"invalid json: {exc}"})
                  continue

              safe = re.sub(r"[^A-Za-z0-9_.-]+", "-", key).strip("-")[:80]

              final_path = final_dir / f"{safe}.final.receipt.json"
              if final_path.exists():
                  print(f"SKIP (already receipted): {key}")
                  results.append({"key": key, "state": "SKIP_ALREADY_DONE"})
                  continue

              text = json.dumps(data).lower()
              BLOCKED_TERMS = ["drop table", "delete from", "destroy", "refund", "charge customer",
                               "iam:", "secret", "credential", "truncate"]
              gate = next((t for t in BLOCKED_TERMS if t in text), None)
              if gate:
                  receipt = {
                      "receipt_type": "pen_final_receipt",
                      "idempotency_key": key,
                      "state": "BLOCKED",
                      "evidence_state": "PARTIAL",
                      "blocker": f"hard gate: '{gate}' — route through approved controlled path",
                      "created_at": now, "repo": repo, "commit_sha": sha,
                      "source_job_path": str(payload_path),
                  }
                  final_path.write_text(json.dumps(receipt, indent=2, sort_keys=True) + "\n")
                  results.append({"key": key, "state": "BLOCKED", "gate": gate})
                  continue

              if not bridge_url or not bridge_key:
                  receipt = {
                      "receipt_type": "pen_final_receipt",
                      "idempotency_key": key,
                      "state": "BLOCKED",
                      "evidence_state": "PARTIAL",
                      "blocker": "BRIDGE_INVOKE_URL or BRIDGE_API_KEY missing",
                      "created_at": now, "repo": repo, "commit_sha": sha,
                      "source_job_path": str(payload_path),
                  }
                  final_path.write_text(json.dumps(receipt, indent=2, sort_keys=True) + "\n")
                  results.append({"key": key, "state": "BLOCKED", "reason": "no bridge creds"})
                  continue

              fn      = data.get("fn") or data.get("action") or "pen-generic-executor"
              envelope = json.dumps({
                  "idempotency_key": key,
                  "fn": fn,
                  "payload": data,
                  "source": "the-pen",
                  "mode": "AUTONOMOUS",
              }).encode("utf-8")

              req = urllib.request.Request(
                  bridge_url, data=envelope, method="POST",
                  headers={"Content-Type": "application/json", "x-api-key": bridge_key}
              )
              try:
                  with urllib.request.urlopen(req, timeout=60) as resp:
                      body   = resp.read().decode("utf-8", errors="replace")
                      status = resp.status
                  ok = 200 <= status < 300
                  state = "REAL" if ok else "PARTIAL"
              except urllib.error.HTTPError as exc:
                  body   = exc.read().decode("utf-8", errors="replace")[:2000]
                  status = exc.code
                  ok     = False
                  state  = "PARTIAL"
              except Exception as exc:
                  body   = str(exc)
                  status = 0
                  ok     = False
                  state  = "FAILED"

              receipt = {
                  "receipt_type":    "pen_inbox_execution_receipt",
                  "idempotency_key": key,
                  "state":           state,
                  "evidence_state":  state,
                  "bridge_status":   status,
                  "bridge_response": body[:3000],
                  "fn":              fn,
                  "created_at":      now,
                  "repo":            repo,
                  "commit_sha":      sha,
                  "workflow_run_id": run_id,
                  "source_job_path": str(payload_path),
                  "autonomous":      True,
                  "hitl_required":   False,
              }

              trigger_path = runtime_dir / f"{safe}.trigger-receipt.json"
              trigger_path.write_text(json.dumps({
                  **receipt,
                  "receipt_type": "pen_inbox_trigger_pre_runtime",
                  "classification": "PARTIAL",
                  "status": "TRIGGER_RECEIVED_RUNTIME_PENDING",
              }, indent=2, sort_keys=True) + "\n")

              final_path.write_text(json.dumps(receipt, indent=2, sort_keys=True) + "\n")
              results.append({"key": key, "state": state, "bridge_http": status})
              print(f"{'OK' if ok else 'PARTIAL'} [{status}] {key}")

          summary = {
              "sweep_at":    now,
              "run_id":      run_id,
              "commit_sha":  sha,
              "total":       len(results),
              "real":        sum(1 for r in results if r.get("state") == "REAL"),
              "partial":     sum(1 for r in results if r.get("state") == "PARTIAL"),
              "failed":      sum(1 for r in results if r.get("state") == "FAILED"),
              "blocked":     sum(1 for r in results if r.get("state") == "BLOCKED"),
              "skipped":     sum(1 for r in results if r.get("state") == "SKIP_ALREADY_DONE"),
              "results":     results,
              "autonomous":  True,
              "hitl":        False,
          }
          pathlib.Path("state/pen_inbox_sweep.json").write_text(
              json.dumps(summary, indent=2, sort_keys=True) + "\n"
          )
          print(f"\nSweep complete: {summary}")
          PY

      - name: Commit receipts and sweep state
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add receipts/ state/ || true
          if git diff --cached --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "pen-inbox: autonomous execute + receipt [${{ github.sha }}]"
            git push
          fi
