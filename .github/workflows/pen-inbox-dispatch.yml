name: Pen Inbox Dispatch

on:
  push:
    branches:
      - main
    paths:
      - 'inbox/**'
      - '.github/workflows/pen-inbox-dispatch.yml'
  workflow_dispatch:
    inputs:
      payload_path:
        description: 'Optional inbox payload path to replay, e.g. inbox/example.json'
        required: false
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: pen-inbox-dispatch-${{ github.ref }}
  cancel-in-progress: false

jobs:
  trigger-receipt:
    name: Emit trigger receipt
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Resolve changed inbox payloads
        id: payloads
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p receipts/runtime

          if [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${{ inputs.payload_path }}" ]]; then
            printf '%s\n' "${{ inputs.payload_path }}" > /tmp/payloads.txt
          else
            git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" \
              | grep '^inbox/.*\.json$' > /tmp/payloads.txt || true
          fi

          if [[ ! -s /tmp/payloads.txt ]]; then
            echo "payload_count=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          sort -u /tmp/payloads.txt > /tmp/payloads.sorted.txt
          mv /tmp/payloads.sorted.txt /tmp/payloads.txt
          echo "payload_count=$(wc -l < /tmp/payloads.txt | tr -d ' ')" >> "$GITHUB_OUTPUT"

      - name: Validate payloads and emit pre-runtime receipts
        if: steps.payloads.outputs.payload_count != '0'
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r payload; do
            if [[ ! -f "$payload" ]]; then
              echo "Missing payload: $payload" >&2
              exit 1
            fi

            python3 - "$payload" <<'PY'
          import hashlib, json, pathlib, re, sys, time
          payload_path = pathlib.Path(sys.argv[1])
          data = json.loads(payload_path.read_text())
          required = ["idempotency_key", "action", "mode", "receipt_expected"]
          missing = [k for k in required if k not in data]
          if missing:
              raise SystemExit(f"Missing required fields in {payload_path}: {missing}")
          idem = str(data["idempotency_key"])
          safe = re.sub(r"[^A-Za-z0-9_.-]+", "-", idem).strip("-") or hashlib.sha256(idem.encode()).hexdigest()[:16]
          digest = hashlib.sha256(payload_path.read_bytes()).hexdigest()
          receipt = {
              "receipt_type": "pen_inbox_trigger_pre_runtime",
              "classification": "PARTIAL",
              "idempotency_key": idem,
              "payload_path": str(payload_path),
              "payload_sha256": digest,
              "trigger_commit_sha": "${{ github.sha }}",
              "trigger_workflow": "pen-inbox-dispatch.yml",
              "trigger_run_id": "${{ github.run_id }}",
              "trigger_run_attempt": "${{ github.run_attempt }}",
              "event_name": "${{ github.event_name }}",
              "status": "TRIGGER_RECEIVED_RUNTIME_PENDING",
              "created_at_epoch": int(time.time()),
              "next_expected": "external runtime/bridge worker must publish final receipt with artifact evidence"
          }
          out = pathlib.Path("receipts/runtime") / f"{safe}.trigger-receipt.json"
          out.write_text(json.dumps(receipt, indent=2, sort_keys=True) + "\n")
          print(out)
          PY
          done < /tmp/payloads.txt

      - name: Commit trigger receipts
        if: steps.payloads.outputs.payload_count != '0'
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- receipts/runtime; then
            echo "No trigger receipt changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add receipts/runtime/*.trigger-receipt.json
          git commit -m "emit pen inbox trigger receipt for ${{ github.sha }}"
          git push
