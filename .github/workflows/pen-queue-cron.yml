name: Pen Queue Processor (Sweep)

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      env:
        description: Target environment
        required: false
        default: production
        type: choice
        options:
          - production
          - dev

permissions:
  contents: write

jobs:
  sweep:
    name: Inbox sweep + drift check (no HITL)
    runs-on: ubuntu-latest
    env:
      # Accept either canonical (BRIDGE_ENDPOINT/BRIDGE_API_KEY) or legacy (BRIDGE_INVOKE_URL/BRIDGE_KEY) names.
      BRIDGE_INVOKE_URL: ${{ secrets.BRIDGE_INVOKE_URL || secrets.BRIDGE_ENDPOINT }}
      BRIDGE_API_KEY:    ${{ secrets.BRIDGE_API_KEY || secrets.BRIDGE_KEY }}
      SUPABASE_URL:      ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      PEN_ENV: ${{ github.event.inputs.env || 'production' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: true

      - name: Sweep any un-receipted inbox payloads
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p receipts/runtime receipts/final state inbox

          # If no inbox files, exit cleanly. Empty inbox is not a failure.
          shopt -s nullglob
          INBOX_FILES=(inbox/*.json)
          if [ ${#INBOX_FILES[@]} -eq 0 ]; then
            echo "ℹ️  inbox/*.json: none found — nothing to sweep"
            echo '{"sweep_at":"'$(date -u +%Y-%m-%dT%H:%M:%SZ)'","swept":0,"skipped":0,"missed":0,"autonomous":true,"empty_inbox":true}' \
              > state/pen_sweep_summary.json
            exit 0
          fi

          python3 - <<'PY'
          import json, os, pathlib, re, urllib.request, urllib.error, datetime

          bridge_url = os.environ.get("BRIDGE_INVOKE_URL", "")
          bridge_key = os.environ.get("BRIDGE_API_KEY", "")
          repo       = os.environ.get("GITHUB_REPOSITORY", "")
          sha        = os.environ.get("GITHUB_SHA", "")
          run_id     = os.environ.get("GITHUB_RUN_ID", "")
          now        = datetime.datetime.utcnow().isoformat() + "Z"

          inbox     = pathlib.Path("inbox")
          final_dir = pathlib.Path("receipts/final")
          final_dir.mkdir(parents=True, exist_ok=True)

          swept = missed = skipped = 0

          for job_path in sorted(inbox.glob("*.json")):
              try:
                  data = json.loads(job_path.read_text())
                  key  = data.get("idempotency_key") or job_path.stem
              except Exception as exc:
                  print(f"[MISSED] {job_path.name}: {exc}")
                  missed += 1
                  continue

              safe       = re.sub(r"[^A-Za-z0-9_.-]+", "-", key).strip("-")[:80]
              final_path = final_dir / f"{safe}.final.receipt.json"

              if final_path.exists():
                  skipped += 1
                  continue

              fn       = data.get("fn") or data.get("action") or "pen-generic-executor"
              envelope = json.dumps({
                  "idempotency_key": key, "fn": fn,
                  "payload": data, "source": "the-pen-sweep", "mode": "AUTONOMOUS",
              }).encode()

              if bridge_url and bridge_key:
                  req = urllib.request.Request(
                      bridge_url, data=envelope, method="POST",
                      headers={"Content-Type": "application/json", "x-api-key": bridge_key},
                  )
                  try:
                      with urllib.request.urlopen(req, timeout=60) as resp:
                          body, status = resp.read().decode(errors="replace")[:2000], resp.status
                      state = "REAL" if 200 <= status < 300 else "PARTIAL"
                  except urllib.error.HTTPError as exc:
                      body, status, state = exc.read().decode(errors="replace")[:2000], exc.code, "PARTIAL"
                  except Exception as exc:
                      body, status, state = str(exc)[:2000], 0, "FAILED"
              else:
                  body, status, state = "no bridge creds (BRIDGE_INVOKE_URL/BRIDGE_ENDPOINT or BRIDGE_API_KEY/BRIDGE_KEY missing)", 0, "BLOCKED"

              receipt = {
                  "receipt_type": "pen_sweep_receipt", "idempotency_key": key,
                  "state": state, "evidence_state": state,
                  "bridge_status": status, "bridge_response": body,
                  "fn": fn, "created_at": now, "repo": repo, "commit_sha": sha,
                  "workflow_run_id": run_id, "source": "pen-queue-cron sweep",
                  "autonomous": True, "hitl_required": False,
              }
              final_path.write_text(json.dumps(receipt, indent=2, sort_keys=True) + "\n")
              print(f"[{state}] {key}")
              swept += 1

          summary = {"sweep_at": now, "swept": swept, "skipped": skipped, "missed": missed, "autonomous": True}
          pathlib.Path("state/pen_sweep_summary.json").write_text(json.dumps(summary, indent=2) + "\n")
          print(f"Sweep done: {summary}")
          PY

      - name: Drift check (optional — skip if script absent)
        shell: bash
        run: |
          set -uo pipefail
          if [ -f scripts/pen-drift-check.mjs ]; then
            npm init -y >/dev/null 2>&1 || true
            npm install @supabase/supabase-js >/dev/null 2>&1
            node scripts/pen-drift-check.mjs || echo "⚠️ drift check returned non-zero (non-fatal)"
          else
            echo "pen-drift-check.mjs not found — skipping"
          fi

      - name: Commit receipts + sweep state
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add receipts/ state/ || true
          if git diff --cached --quiet; then
            echo "Nothing new."
            exit 0
          fi
          git commit -m "pen-sweep: autonomous cycle receipts [${PEN_ENV}]"
          git pull --rebase --autostash origin main || true
          git push
