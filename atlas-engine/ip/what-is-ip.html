<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root,[data-theme="light"]{
  --bg:#f7f6f2;--surface:#f9f8f5;--surface2:#fbfbf9;--offset:#f0ede8;--border:rgba(40,37,29,.11);--divider:#dcd9d5;
  --text:#28251d;--muted:#6a6860;--faint:#aaa89f;--inv:#f9f8f4;
  --primary:#01696f;--ph:#0c4e54;--success:#437a22;--warn:#964219;--error:#a12c7b;--blue:#006494;--gold:#d19900;--purple:#7a39bb;
  --r:0.75rem;--rl:1rem;--rx:1.25rem;--sh:0 2px 8px rgba(0,0,0,.06);--shh:0 8px 28px rgba(0,0,0,.10);
  --font:'Inter',sans-serif;
}
[data-theme="dark"]{
  --bg:#171614;--surface:#1c1b19;--surface2:#201f1d;--offset:#222120;--border:rgba(255,255,255,.08);--divider:#2e2d2b;
  --text:#cdccca;--muted:#9a9895;--faint:#5a5957;--inv:#2b2a28;
  --primary:#4f98a3;--ph:#227f8b;--success:#6daa45;--warn:#bb653b;--error:#d163a7;--blue:#5591c7;--gold:#e8af34;--purple:#a86fdf;
  --sh:0 2px 8px rgba(0,0,0,.2);--shh:0 8px 28px rgba(0,0,0,.35);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);background:var(--bg);color:var(--text);line-height:1.55;font-size:16px}
header{padding:28px 32px 0;display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:16px}
h1{font-size:clamp(1.5rem,2.5vw,2.2rem);font-weight:800;letter-spacing:-.02em}
.sub{color:var(--muted);font-size:.95rem;margin-top:6px;max-width:580px}
.btn{border:none;padding:10px 16px;border-radius:999px;cursor:pointer;font-size:.85rem;font-weight:600;background:var(--surface);color:var(--text);border:1px solid var(--border)}
.btn.active,.btn:hover{background:var(--primary);color:var(--inv);border-color:var(--primary)}
.filters{display:flex;gap:8px;flex-wrap:wrap;padding:20px 32px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px;padding:20px 32px 48px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--rx);box-shadow:var(--sh);cursor:pointer;transition:box-shadow .2s,transform .15s;overflow:hidden}
.card:hover{box-shadow:var(--shh);transform:translateY(-2px)}
.card-head{padding:20px 20px 16px;display:flex;gap:14px;align-items:flex-start}
.icon{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:1.35rem;flex-shrink:0}
.card-title{font-weight:700;font-size:1rem;line-height:1.25}
.card-tagline{font-size:.82rem;color:var(--muted);margin-top:4px}
.pill{display:inline-block;padding:3px 9px;border-radius:999px;font-size:.72rem;font-weight:600;margin-top:6px}
.card-body{padding:0 20px 0;max-height:0;overflow:hidden;transition:max-height .35s ease,padding .2s}
.card.open .card-body{max-height:600px;padding-bottom:18px}
.card-body p{font-size:.88rem;color:var(--text);line-height:1.6;margin-bottom:10px}
.card-body .row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.tag{padding:4px 8px;border-radius:6px;font-size:.75rem;background:var(--offset);color:var(--muted)}
.divider{height:1px;background:var(--divider);margin:10px 0}
.value-line{font-size:.82rem;display:flex;gap:8px;margin-bottom:5px;align-items:flex-start}
.value-line span:first-child{font-weight:600;color:var(--muted);flex-shrink:0;width:90px}
.togglebar{display:flex;align-items:center;justify-content:space-between;padding:0 20px 14px}
.arrow{font-size:.75rem;color:var(--faint);transition:transform .3s}
.card.open .arrow{transform:rotate(180deg)}
.group-label{grid-column:1/-1;font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--faint);padding:8px 0 2px}
footer{text-align:center;padding:16px;font-size:.78rem;color:var(--faint)}
@media(max-width:600px){.grid{padding:16px}.filters{padding:12px 16px}header{padding:20px 16px 0}}
</style>
</head>

  <button class="btn" onclick="toggleTheme()">Toggle theme</button>

const grid = document.getElementById('grid');
const filtersEl = document.getElementById('filters');
let activeFilter = 'all';

function renderFilters(){
  filtersEl.innerHTML = '';
  const all = document.createElement('button');
  all.className = 'btn' + (activeFilter==='all'?' active':'');
  all.textContent = 'All';
  all.onclick = ()=>{ activeFilter='all'; render(); renderFilters(); };
  filtersEl.appendChild(all);
  GROUPS.forEach(g=>{
    const b = document.createElement('button');
    b.className = 'btn' + (activeFilter===g.id?' active':'');
    b.textContent = g.label;
    b.onclick = ()=>{ activeFilter=g.id; render(); renderFilters(); };
    filtersEl.appendChild(b);
  });
}

function render(){
  grid.innerHTML = '';
  const groups = activeFilter==='all' ? GROUPS : GROUPS.filter(g=>g.id===activeFilter);
  groups.forEach(g=>{
    const label = document.createElement('div');
    label.className = 'group-label';
    label.textContent = g.label;
    grid.appendChild(label);
    g.items.forEach(item=>{
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `
        <div class="card-head">
          <div class="icon" style="background:${g.bg};color:${g.color}">${item.icon}</div>
          <div>
            <div class="card-title">${item.name}</div>
            <div class="card-tagline">${item.tagline}</div>
            <span class="pill" style="background:${g.bg};color:${g.color}">${item.form}</span>
          </div>
        </div>
        <div class="togglebar">
          <span style="font-size:.78rem;color:var(--muted)">Tap for who it helps &amp; why it matters</span>
          <span class="arrow">▼</span>
        </div>
        <div class="card-body">
          <div class="value-line"><span>For</span><span>${item.user}</span></div>
          <div class="value-line"><span>The problem</span><span>${item.world}</span></div>
          <div class="value-line"><span>The value</span><span>${item.value}</span></div>
          <div class="value-line"><span>Why unique</span><span>${item.why}</span></div>
          <div class="divider"></div>
          <div class="row">${item.tags.map(t=>`<span class="tag">${t}</span>`).join('')}</div>
        </div>`;
      card.onclick = ()=>{ card.classList.toggle('open'); };
      grid.appendChild(card);
    });
  });
}

renderFilters();
render();

function toggleTheme(){
  const h = document.documentElement;
  h.setAttribute('data-theme', h.getAttribute('data-theme')==='dark'?'light':'dark');
}
</script>
</body>
</html>
