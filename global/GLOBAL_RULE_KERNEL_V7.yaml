---

# ============================================================
# 0. PRIME DIRECTIVE
# ============================================================

prime_directive:
  statement: "A posted job is a contract. Completion is mandatory."
  laws:
    - "No partials without evidence"
    - "No drift"
    - "No silent exits"
    - "No claim without proof"
    - "No execution without receipt"
  canonical_statement: >
    All AI-generated actions are intent only.
    All execution occurs via MCP Bridge using controlled functions.
    Direct system access is forbidden.

---

# ============================================================
# 1. REALITY LEDGER (TRUTH ENFORCEMENT)
# ============================================================

reality_ledger:
  states:
    REAL:
      definition: "Live runtime receipts exist. Telemetry confirmed. Evidence bound. Outcome proven."
      requires:
        - live_runtime_receipts
        - telemetry_continuity
        - economic_outcome_proof
        - deterministic_recovery_validation
        - graph_coherence_integrity
    PARTIAL:
      definition: "Some evidence exists. Gaps remain in execution, receipts, or telemetry."
      requires:
        - at_least_one_verified_evidence_artifact
    PRETEND:
      definition: "Claimed without receipt. Never promote to REAL."
      action: "Reject immediately. Log to audit.log."
    BLOCKED:
      definition: "Required dependency, authority, or credential unavailable."
      action: "Escalate with payload. Do not stall."
  downgrade_conditions:
    - manual_dependency_detected
    - missing_telemetry
    - receipt_mismatch
    - economic_loop_failure
    - ontology_drift
    - recovery_unproven
  honest_default: "PARTIAL_UNPROVEN until runtime proof exists"
  table: "audit.reality_ledger"
  accepts: ["REAL", "PARTIAL"]
  rejects: ["PRETEND", "BLOCKED_as_REAL"]

---

# ============================================================
# 2. EXECUTION PHASE MODEL (HARD-WIRED)
# ============================================================

execution_phase_model:
  invariant: "No step skipped. No direct execution from LLM."
  phases:
    BOOT:
      action: "Load global rules + Pen preflight + comms context"
      output: "Context aligned"
      evidence: "Preflight receipt with rule SHA"
      blocks_if_missing: true
    PARSE:
      action: "Extract intent + constraints + authority"
      output: "Structured intent object"
      evidence: "Intent log"
    PLAN:
      action: "Shortest path to DONE. Reuse before build."
      output: "Execution plan"
      evidence: "Plan log"
    QUEUE:
      action: "Commit to inbox (idempotent). Pen = intake gate."
      output: "Job file in GitHub inbox/"
      evidence: "GitHub commit SHA"
    EXEC:
      action: "Worker -> Bridge -> Lambda -> Runtime"
      output: "Runtime result"
      evidence: "Receipt in receipts/runtime/"
    VERIFY:
      action: "Validate output vs intent. Check telemetry."
      output: "PASS / FAIL / BLOCKED"
      evidence: "Audit row in audit.log"
    CLOSE:
      action: "Complete or escalate with payload. Never stall."
      output: "Closed state"
      evidence: "Final receipt"

---

# ============================================================
# 3. OPERATING LAWS
# ============================================================

operating_laws:
  completion_law:
    rule: "Work ends only when DONE criteria are met"
    enforcement: "Auto-block closure without DoD pass"
  evidence_law:
    rule: "No claim without proof. Observed beats assumed."
    enforcement: "Reject PRETEND. Downgrade unsupported claims."
  idempotency_law:
    rule: "All execution must be safe to re-run"
    enforcement: "Required idempotency_key on all jobs"
  queue_law:
    rule: "All execution via queue. No direct LLM execution."
    enforcement: "Bridge-only write path. Pen = intake gate."
  ownership_law:
    rule: "Agent owns outcome end-to-end"
    enforcement: "No deflection. Escalate with payload."
  escalation_law:
    rule: "Block then escalate with full payload. Never stall."
    enforcement: "BLOCKED state requires next_step and rollback"
  simplicity_law:
    rule: "Simplest viable path wins. Reuse before rebuild."
    enforcement: "Reject overdesign. Mandate reuse scan."

---

# ============================================================
# 4. EXECUTION PATH (CANONICAL)
# ============================================================

execution_path:
  canonical:
    - "ANY ACTOR (LLM / agent / human / cron)"
    - "Pen Preflight (pen_preflight() — PASS required)"
    - "GitHub inbox/ (TML-4PM/the-pen)"
    - "Worker (Mac=endpoint only; EC2=production runner)"
    - "Bridge (https://zdgnab3py0.execute-api.ap-southeast-2.amazonaws.com/prod/lambda/invoke)"
    - "Lambda (troy-sql-executor)"
    - "Supabase (lzfgigiyqpuuxslsygjt)"
    - "Receipt (receipts/runtime/)"
    - "Audit (audit.log)"
    - "Command Centre"

  bridge:
    status: "constitutional_execution_authority"
    url: "https://zdgnab3py0.execute-api.ap-southeast-2.amazonaws.com/prod/lambda/invoke"
    envelope: '{"fn":"troy-sql-executor","sql":"..."}'
    fallback_rule: "Tool unavailability is not a stopping point. Route through bridge and continue."
    write_status: "LIVE (MCP_ALLOW_WRITES=true)"
    concurrency_fix: "put-function-concurrency to 100 when throttled to 0"

  pen:
    role: "compiler — canonical rule source and intake gate"
    repo: "TML-4PM/the-pen"
    preflight_required: true
    receipt_required: true

  ec2:
    role: "production runner"
    instance: "i-09f18f2e1123a5702"
    region: "ap-southeast-2a"
    rule: "Mac = endpoint only. EC2 = always-on production lane."

  github_write_rule:
    path: "fn_github_push via troy-sql-executor only"
    direct_writes: "FORBIDDEN"
    connectors: "BANNED for writes"

---

# ============================================================
# 5. PEN PREFLIGHT CONTRACT
# ============================================================

pen_preflight:
  status: "CANONICAL RULE"
  hard_rule: "No Pen receipt = no execution. No rule load = no compliance claim."
  required_start_sequence:
    1: "Identify task intent"
    2: "Identify execution actor"
    3: "Identify execution surface"
    4: "Fetch current canonical Pen rules"
    5: "Load rule hierarchy"
    6: "Load relevant house rules"
    7: "Load relevant onboarding notes"
    8: "Load relevant service catalog rules"
    9: "Determine authority, allowed actions, blocked actions, escalation gates"
    10: "Emit preflight receipt"
    11: "Continue only if receipt status = PASS"
  rule_hierarchy:
    1: "GLOBAL_RULE.md"
    2: "MCP_EXECUTION_CONTRACT.md"
    3: "ENFORCEMENT_LIVE.md"
    4: "runtime/*.md"
    5: "house-rules/*.md"
    6: "onboarding/*.md"
    7: "offboarding/*.md"
    8: "service-catalog/*.md"
    9: "assets/*.md"
    10: "memos/*.md"
  blocking_conditions:
    - required_rule_files_cannot_be_loaded
    - actor_identity_unknown
    - task_intent_unclear_and_creates_unsafe_execution
    - destructive_action_without_authority
    - credentials_or_secrets_requested_directly
    - financial_legal_safety_identity_threshold_crossed
    - service_catalog_dependency_missing
    - asset_reuse_search_not_performed_where_required
    - reality_ledger_binding_unavailable_for_REAL_claim
    - execution_would_create_untracked_assets
    - no_offboarding_path_for_long_running_work
  minimum_implementation:
    - "pen_preflight() function"
    - "pen_receipts table or equivalent ledger"
    - "current rule commit SHA capture"
    - "actor identity capture"
    - "task intent capture"
    - "PASS/BLOCKED/PARTIAL status"
    - "machine-readable output"
    - "human-readable summary"
    - "link to evidence"

---

# ============================================================
# 6. AUTONOMOUS CONFIDENCE THRESHOLDS
# ============================================================

confidence_thresholds:
  execute_autonomously:
    condition: "pattern_confidence > 0.90"
    action: "Execute. Log. Continue."
  execute_and_flag:
    condition: "pattern_confidence >= 0.70 AND <= 0.90"
    action: "Execute. Flag uncertainty inline. Continue."
  escalate:
    condition: "pattern_confidence < 0.70"
    action: "Escalate uncertainty. Do not guess. Wrap and send to Pen."
  hitl_policy:
    allowed:
      - destructive_action
      - ambiguous_legal_or_financial
    default: "Automate or simulate first. HITL = last resort."
    prohibited:
      - waiting_without_action
      - talking_instead_of_executing
      - partial_completion_without_receipt

---

# ============================================================
# 7. BRIDGE AUTHORITY (CONSTITUTIONAL)
# ============================================================

bridge_authority:
  status: "default_execution_authority"
  rules:
    - "Bridge is the execution path. Not a fallback."
    - "Bridge receipts required for REAL classification"
    - "All tool unavailability routes through bridge"
  traps:
    audit_log_rest: "REST=404 (broken) — use bridge SQL path"
    reality_ledger: "accepts REAL/PARTIAL only"
    mcp_write_tools: "default dryRun=true — must set false explicitly"
    concurrency: "ReservedConcurrentExecutions=0 recurs — fix with put-function-concurrency=100"

