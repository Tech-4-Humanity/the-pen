      status: "PARTIAL — deploy required"
    topic_workers:
      role: "Domain execution"
      status: "ACTIVE"
    sweepers:
      role: "Retry / dead job recovery"
      status: "REQUIRED — cron activation needed"
    bridge_workers:
      role: "External execution via Lambda"
      status: "ACTIVE"
  routing_rule: "All threads -> Analyst -> Routed -> Workers -> Verified -> Closed"
  state_model:
    observed: "Highest trust"
    logged: "Required"
    assumed: "Avoid"
    missing: "Trigger retrieval"
    lifecycle: "QUEUED -> ACTIVE -> VALIDATING -> COMPLETE | BLOCKED -> CLOSED | LOCKED"
  work_queue_states:
    - submitted
    - accepted
    - triaged
    - ready
    - claimed
    - in_progress
    - done
    - verified
    - promoted
    - closed

