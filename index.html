<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Pen — DEV</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0e0e0c;
      --surface: #161614;
      --border: #2a2a27;
      --text: #cdccca;
      --text-muted: #797876;
      --accent: #4f98a3;
      --dev: #e8af34;
      --font: 'Inter', system-ui, sans-serif;
    }
    html { background: var(--bg); color: var(--text); font-family: var(--font); }
    body { min-height: 100dvh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 2rem; }
    .env-banner {
      position: fixed; top: 0; left: 0; right: 0;
      background: var(--dev);
      color: #0e0e0c;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-align: center;
      padding: 0.35rem;
      text-transform: uppercase;
    }
    .logo { margin-bottom: 2rem; margin-top: 2rem; }
    .logo svg { width: 48px; height: 48px; }
    h1 { font-size: clamp(1.5rem, 4vw, 2.5rem); font-weight: 600; letter-spacing: -0.02em; margin-bottom: 0.5rem; }
    .env-tag {
      display: inline-block;
      background: var(--dev);
      color: #0e0e0c;
      font-size: 0.65rem;
      font-weight: 800;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 0.15rem 0.5rem;
      border-radius: 4px;
      margin-left: 0.5rem;
      vertical-align: middle;
    }
    p { color: var(--text-muted); font-size: 1rem; margin-bottom: 2.5rem; max-width: 40ch; text-align: center; }
    .status { display: flex; gap: 0.75rem; flex-wrap: wrap; justify-content: center; margin-bottom: 1.5rem; }
    .pill {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 0.35rem 0.9rem;
      font-size: 0.8rem;
      color: var(--text-muted);
      display: flex; align-items: center; gap: 0.4rem;
    }
    .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
    .dot.amber { background: var(--dev); }
    .promote-btn {
      background: var(--accent);
      color: #0e0e0c;
      border: none;
      border-radius: 8px;
      padding: 0.6rem 1.4rem;
      font-size: 0.875rem;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      transition: opacity 0.15s;
    }
    .promote-btn:hover { opacity: 0.85; }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
    footer { margin-top: 3rem; font-size: 0.75rem; color: var(--text-muted); }
  </style>
</head>
<body>
  <div class="env-banner">⚠ Development Environment — Not Production</div>
  <div class="logo">
    <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg" aria-label="The Pen">
      <rect width="48" height="48" rx="12" fill="#161614"/>
      <path d="M32 10 L38 16 L18 36 L10 38 L12 30 Z" stroke="#4f98a3" stroke-width="2" stroke-linejoin="round" fill="none"/>
      <path d="M28 14 L34 20" stroke="#4f98a3" stroke-width="2" stroke-linecap="round"/>
    </svg>
  </div>
  <h1>The Pen <span class="env-tag">dev</span></h1>
  <p>Execution engine for Tech 4 Humanity — inbox → receipt pipeline.</p>
  <div class="status">
    <span class="pill"><span class="dot"></span> Runtime active</span>
    <span class="pill"><span class="dot amber"></span> Receipts: <a href="https://github.com/TML-4PM/the-pen/tree/dev/receipts/runtime" target="_blank" rel="noopener">view</a></span>
    <span class="pill"><span class="dot"></span> Inbox: <a href="https://github.com/TML-4PM/the-pen/tree/dev/inbox" target="_blank" rel="noopener">view</a></span>
  </div>
  <a class="promote-btn" href="https://github.com/TML-4PM/the-pen/compare/main...dev" target="_blank" rel="noopener">
    ↑ Promote dev → main (PR)
  </a>
  <footer>
    TML-4PM / the-pen &mdash;
    <a href="https://github.com/TML-4PM/the-pen" target="_blank" rel="noopener">GitHub</a> &mdash;
    <a href="https://the-pen-fy6n.vercel.app" target="_blank" rel="noopener">Production ↗</a>
  </footer>
</body>
</html>
