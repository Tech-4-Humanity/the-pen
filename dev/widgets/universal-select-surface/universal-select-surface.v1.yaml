  location: dev/widgets/universal-select-surface/universal-select-surface.v1.yaml
  summary: >
    Built a reusable dropdown/select primitive as a metadata-driven operational
    surface for agent selection, workflow routing, consent changes, model switching,
    environment selection, severity controls, telemetry filtering, bridge dispatch,
    and Reality Ledger evidence capture.

discussion:
  pass_1: >
    The object is not a dropdown. It is a canonical selectable intent surface.
    Its first job is to normalise how humans choose structured intent so agents,
    workflows, evidence systems, and governance layers can react deterministically.
  pass_2: >
    The reusable value sits in the runtime contract. Each consuming product should
    render from metadata rather than hardcoded UI. That makes the same primitive
    reusable across Command Centre, Synal, Agent Channel, WorkFamilyAI, ConsentX,
    NEUROPAK, HoloOrg, Outcome Ready, and internal dev/prod controls.

