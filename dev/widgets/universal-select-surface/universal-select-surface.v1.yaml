react_component:
  file: UniversalSelectSurface.tsx
  code: |
    import React, { useEffect, useMemo, useState } from 'react';

    type LocalizedLabel = Record<string, string>;
    type SelectOption = {
      value: string;
      label: LocalizedLabel;
      group?: string;
      description?: LocalizedLabel;
      metadata?: Record<string, unknown>;
      visibility_roles?: string[];
      disabled?: boolean;
    };
    type SelectDefinition = {
      id: string;
      label: LocalizedLabel;
      description?: LocalizedLabel;
      mode: 'single_select' | 'multi_select' | 'searchable' | 'hierarchical' | 'command_palette' | 'quick_action' | 'filter_surface' | 'orchestration_router' | 'agent_selector';
      datasource?: { type: 'static' | 'supabase' | 'api' | 'bridge' | 'computed'; endpoint?: string; table?: string };
      options?: SelectOption[];
      permissions?: { roles?: string[]; visibility_policy?: 'allow_by_default' | 'deny_by_default' };
      telemetry?: { enabled: boolean; event_namespace?: string };
      bridge?: { enabled: boolean; action: string; dispatch_mode: 'immediate' | 'queued' | 'approval_gated'; endpoint?: string };
      evidence?: { enabled: boolean; ledger_table?: string; classification_required?: boolean };
      runtime?: { environment?: 'dev' | 'staging' | 'prod'; refresh?: 'static' | 'manual' | 'realtime'; fallback_behavior?: 'disable' | 'static_options' | 'last_known_good' };
    };
    type Props = { definition: SelectDefinition; language?: string; userRole?: string; runtimeContext?: Record<string, unknown>; onChange?: (payload: Record<string, unknown>) => void };
    const readLabel = (label: LocalizedLabel | undefined, language: string) => label?.[language] || label?.en || '';

    export function UniversalSelectSurface({ definition, language = 'en', userRole = 'operator', runtimeContext = {}, onChange }: Props) {
      const [selected, setSelected] = useState<string[]>([]);
      const [query, setQuery] = useState('');
      const [asyncOptions, setAsyncOptions] = useState<SelectOption[]>(definition.options || []);
      const isMulti = definition.mode === 'multi_select' || definition.mode === 'agent_selector';

      useEffect(() => {
        let cancelled = false;
        async function loadOptions() {
          if (!definition.datasource?.endpoint) return;
          if (!['api', 'bridge'].includes(definition.datasource.type)) return;
          const res = await fetch(definition.datasource.endpoint);
          const data = await res.json();
          if (!cancelled) setAsyncOptions(data.options || []);
        }
        loadOptions().catch(() => { if (definition.runtime?.fallback_behavior === 'disable') setAsyncOptions([]); });
        return () => { cancelled = true; };
      }, [definition.datasource?.endpoint, definition.datasource?.type]);

      const visibleOptions = useMemo(() => asyncOptions
        .filter(option => !option.visibility_roles?.length || option.visibility_roles.includes(userRole))
        .filter(option => `${readLabel(option.label, language)} ${option.value} ${option.group || ''}`.toLowerCase().includes(query.toLowerCase())),
        [asyncOptions, userRole, language, query]);

      async function dispatchBridge(payload: Record<string, unknown>) {
        if (!definition.bridge?.enabled || definition.bridge.dispatch_mode === 'approval_gated') return;
        await fetch(definition.bridge.endpoint || '/api/bridge/dispatch', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action: definition.bridge.action, dispatch_mode: definition.bridge.dispatch_mode, source: 'universal_select_surface', definition_id: definition.id, runtime_context: runtimeContext, payload })
        });
      }

      async function recordTelemetry(payload: Record<string, unknown>) {
        if (!definition.telemetry?.enabled) return;
        await fetch('/api/telemetry/select-event', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ namespace: definition.telemetry.event_namespace || 'universal_select_surface', event_type: 'selection.changed', definition_id: definition.id, environment: definition.runtime?.environment || 'dev', runtime_context: runtimeContext, payload })
        }).catch(() => undefined);
      }

      async function updateSelection(value: string) {
        const next = isMulti ? selected.includes(value) ? selected.filter(v => v !== value) : [...selected, value] : [value];
        setSelected(next);
        const payload = { selected_value: isMulti ? undefined : value, selected_values: next, changed_at: new Date().toISOString(), classification: definition.evidence?.classification_required ? 'PARTIAL' : undefined };
        onChange?.(payload);
        await recordTelemetry(payload);
        await dispatchBridge(payload);
      }

      return (
        <section className="w-full rounded-2xl border p-4 shadow-sm bg-white">
          <div className="mb-3">
            <label className="block text-sm font-semibold">{readLabel(definition.label, language)}</label>
            {definition.description && <p className="text-xs opacity-70">{readLabel(definition.description, language)}</p>}
          </div>
          {(definition.mode === 'searchable' || definition.mode === 'agent_selector' || definition.mode === 'command_palette') && (
            <input className="mb-3 w-full rounded-xl border px-3 py-2 text-sm" placeholder="Search..." value={query} onChange={event => setQuery(event.target.value)} />
          )}
          <div className="grid gap-2">
            {visibleOptions.map(option => {
              const active = selected.includes(option.value);
              return (
                <button key={option.value} disabled={option.disabled} onClick={() => updateSelection(option.value)} className={`rounded-xl border px-3 py-2 text-left text-sm ${active ? 'ring-2' : ''}`}>
                  <div className="font-medium">{readLabel(option.label, language)}</div>
                  {option.description && <div className="text-xs opacity-70">{readLabel(option.description, language)}</div>}
                  {option.group && <div className="mt-1 text-[11px] uppercase opacity-50">{option.group}</div>}
                </button>
              );
            })}
          </div>
        </section>
      );
    }

