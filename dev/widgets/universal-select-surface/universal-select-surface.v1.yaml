supabase_schema:
  sql: |
    create table if not exists public.universal_select_definitions (
      id text primary key,
      version text not null default '1.0.0',
      active boolean not null default true,
      definition jsonb not null,
      created_at timestamptz not null default now(),
      updated_at timestamptz not null default now()
    );

    create table if not exists public.universal_select_events (
      id uuid primary key default gen_random_uuid(),
      definition_id text not null references public.universal_select_definitions(id),
      event_type text not null,
      selected_value text,
      selected_values text[] default '{}',
      runtime_context jsonb default '{}'::jsonb,
      telemetry jsonb default '{}'::jsonb,
      bridge_receipt_id text,
      evidence_id text,
      classification text check (classification in ('REAL','PARTIAL','BLOCKED')) default 'PARTIAL',
      created_at timestamptz not null default now()
    );

    create index if not exists universal_select_events_definition_idx
    on public.universal_select_events(definition_id, created_at desc);

    create or replace view public.v_universal_select_active as
    select id, version, definition, updated_at
    from public.universal_select_definitions
    where active = true;

