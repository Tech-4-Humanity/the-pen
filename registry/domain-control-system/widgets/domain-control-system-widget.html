<section id="domain-control-system" style="font-family:Inter,system-ui,sans-serif; padding:20px; border-radius:20px; border:1px solid #222; background:#0b0f17; color:#f8fafc;">
  <header style="display:flex; justify-content:space-between; gap:16px; align-items:flex-start; margin-bottom:18px;">
    <div>
      <h2 style="margin:0; font-size:24px;">Domain Control System</h2>
      <p style="margin:6px 0 0; color:#94a3b8;">AWS Route53 → Supabase → Command Centre governance loop</p>
    </div>
    <span id="dcs-status" style="padding:6px 10px; border-radius:999px; background:#172554; color:#bfdbfe; font-size:12px;">loading</span>
  </header>

  <div id="dcs-cards" style="display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; margin-bottom:18px;"></div>

  <div style="display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px;">
    <button data-filter="all">All</button>
    <button data-filter="attention">Attention</button>
    <button data-filter="kill">Kill</button>
    <button data-filter="nonreal">Non-REAL</button>
    <button data-filter="mail">Mail only</button>
  </div>

  <div style="overflow:auto; border:1px solid #1e293b; border-radius:14px;">
    <table style="width:100%; border-collapse:collapse; font-size:13px;">
      <thead style="background:#111827; color:#cbd5e1;">
        <tr>
          <th style="text-align:left; padding:10px;">Domain</th>
          <th style="text-align:left; padding:10px;">Canonical</th>
          <th style="text-align:left; padding:10px;">Status</th>
          <th style="text-align:left; padding:10px;">Reality</th>
          <th style="text-align:left; padding:10px;">Records</th>
          <th style="text-align:left; padding:10px;">Notes</th>
        </tr>
      </thead>
      <tbody id="dcs-rows"></tbody>
    </table>
  </div>
</section>

<script>
(async function(){
  const SUPABASE_URL = window.T4H_SUPABASE_URL || '';
  const SUPABASE_ANON_KEY = window.T4H_SUPABASE_ANON_KEY || '';
  const statusEl = document.getElementById('dcs-status');
  const cardsEl = document.getElementById('dcs-cards');
  const rowsEl = document.getElementById('dcs-rows');
  let rows = [];

  function pill(v){ return `<span style="padding:3px 8px;border-radius:999px;background:#1f2937;color:#e5e7eb;white-space:nowrap;">${v || 'unknown'}</span>`; }
  function card(label, value){ return `<div style="background:#111827;border:1px solid #1e293b;border-radius:14px;padding:14px;"><div style="color:#94a3b8;font-size:12px;">${label}</div><div style="font-size:24px;font-weight:800;">${value}</div></div>`; }
  function counts(){
    return {
      total: rows.length,
      canonical: rows.filter(r=>r.canonical_status==='canonical').length,
      attention: rows.filter(r=>['candidate','kill','blocked','unknown'].includes(r.canonical_status)||r.reality_state!=='REAL').length,
      kill: rows.filter(r=>r.canonical_status==='kill').length,
      mail: rows.filter(r=>r.domain_status==='mail_only').length,
      nonreal: rows.filter(r=>r.reality_state!=='REAL').length
    };
  }
  function render(filter='all'){
    const c = counts();
    cardsEl.innerHTML = card('Total', c.total)+card('Canonical', c.canonical)+card('Attention', c.attention)+card('Kill', c.kill)+card('Mail only', c.mail)+card('Non-REAL', c.nonreal);
    let view = rows;
    if(filter==='attention') view = rows.filter(r=>['candidate','kill','blocked','unknown'].includes(r.canonical_status)||r.reality_state!=='REAL');
    if(filter==='kill') view = rows.filter(r=>r.canonical_status==='kill');
    if(filter==='nonreal') view = rows.filter(r=>r.reality_state!=='REAL');
    if(filter==='mail') view = rows.filter(r=>r.domain_status==='mail_only');
    rowsEl.innerHTML = view.map(r=>`<tr style="border-top:1px solid #1e293b;"><td style="padding:10px;">${r.normalized_domain}</td><td style="padding:10px;">${pill(r.canonical_status)}</td><td style="padding:10px;">${pill(r.domain_status)}</td><td style="padding:10px;">${pill(r.reality_state)}</td><td style="padding:10px;">${r.record_count ?? ''}</td><td style="padding:10px;color:#94a3b8;min-width:260px;">${r.notes || ''}</td></tr>`).join('');
  }

  document.querySelectorAll('#domain-control-system button').forEach(b=>b.onclick=()=>render(b.dataset.filter));

  if(!SUPABASE_URL || !SUPABASE_ANON_KEY){
    statusEl.textContent = 'env missing';
    rowsEl.innerHTML = '<tr><td style="padding:12px;color:#fca5a5;" colspan="6">Set window.T4H_SUPABASE_URL and window.T4H_SUPABASE_ANON_KEY before loading widget.</td></tr>';
    return;
  }

  const res = await fetch(`${SUPABASE_URL}/rest/v1/registry.v_aws_hosted_zone_registry_active?select=*`, { headers: { apikey: SUPABASE_ANON_KEY, Authorization: `Bearer ${SUPABASE_ANON_KEY}` }});
  rows = await res.json();
  statusEl.textContent = res.ok ? 'live' : 'error';
  render();
})();
</script>
