outputs:
  posters:
    - HUMANITY_ATLAS_MASTER_POSTER_A0
    - CUBE_OF_CUBES_POSTER_A0
    - HUMAN_RUNTIME_MAP_POSTER_A0
  graphs:
    - AssetDependencyGraph
    - RuntimeDependencyGraph
    - CapabilityDependencyGraph
    - CommercialDependencyGraph
  dashboards:
    - PortfolioHealth
    - RevenueCoverage
    - ResearchCoverage
    - EvidenceCoverage

rules:
  before_new_asset:
    - Attach to existing domain.
    - Reuse existing capabilities where possible.
    - Declare dependencies.
    - Declare evidence path.
    - Declare runtime path.
    - Declare commercial model or mark non-commercial.
  completion:
    REAL_requires:
      - runtime receipt
      - evidence binding
      - owner
      - source repo or system of record
      - next operating action
    PARTIAL_when:
      - artefact exists but runtime proof is missing
      - telemetry is unavailable
      - dependency graph is incomplete
    BLOCKED_when:
      - credentials missing
      - runtime unavailable
      - legal or safety boundary reached

next_actions:
  - Populate all remaining active assets from GitHub issues and repository inventory.
  - Generate AssetDependencyGraph from this registry.
  - Generate HUMANITY_ATLAS_MASTER_POSTER_A0.
  - Patch RuntimeProof workflows to report missing telemetry as PARTIAL rather than failure.
  - Bind registry to RealityLedger and CommandCentre.
