atlas:
  id: HUMANITY_ATLAS_REGISTRY
  version: "1.0"
  status: PARTIAL
  owner: Troy Latter
  repository: TML-4PM/the-pen
  purpose: >
    Canonical registry for the Tech for Humanity / AI for Humanity portfolio.
    It binds assets, domains, capabilities, runtime dependencies, evidence paths,
    maturity, and commercial models to the seven-layer Humanity Atlas spine.
  classification_reason: >
    Registry schema and initial population are committed. It remains PARTIAL until
    every active asset is populated, dependency checks are executed, runtime receipts
    are bound, and portfolio health dashboards are generated from this source.

spine:
  L1:
    name: Signal and Reality
    question: What is actually happening?
  L2:
    name: Evidence and Governance
    question: Can it be trusted?
  L3:
    name: Runtime and Orchestration
    question: What should happen next?
  L4:
    name: Product and Experience
    question: How do people interact?
  L5:
    name: Intelligence and Research
    question: What have we learned?
  L6:
    name: Human Runtime Map
    question: How do humans, organisations, and systems evolve?
  L7:
    name: Humanity Atlas
    question: How does everything connect?

capability_taxonomy:
  - signal
  - consent
  - identity
  - evidence
  - governance
  - runtime
  - orchestration
  - learning
  - coaching
  - analytics
  - marketplace
  - autonomy
  - research
  - commercialisation
  - recovery
  - reliability

domains:
  Human:
    purpose: Human flourishing, capability, learning, work, family and care.
    assets:
      - OutcomeReady
      - ReadingBuddy
      - SchoolFamilyAI
      - WorkFamilyAI
      - ClassByCass
      - AugmentedHumanityCoach
  Signal:
    purpose: Human, biological, behavioural, device and contextual signal truth.
    assets:
      - MyNeuralSignal
      - UBI
      - NeuroPAK
      - ConsentX
      - SignalPresence
      - LifeGraphPlus
  Runtime:
    purpose: Execution, orchestration, worker routing, queue control and receipts.
    assets:
      - CommandCentre
      - Bridge
      - RuntimeWorkers
      - QueueEngine
      - MCPControlPlane
  Governance:
    purpose: Trust, audit, safety, standards, recovery and proof.
    assets:
      - RealityLedger
      - RuntimeProof
      - IntegrityStack
      - GCBAT
      - FAR_CAGE
  Intelligence:
    purpose: Research, models, hypotheses, frameworks and reusable knowledge.
    assets:
      - AIForHumanity
      - HumanRuntimeMap
      - ResearchVault
      - HumanityAtlas
      - Hundred
      - NeuralEnnead
      - AISweetSpots
      - OrganisationalMetabolismRuntime
  Autonomy:
    purpose: Human-machine systems, physical autonomy, robotics and field execution.
    assets:
      - RATPAK
      - FAR_CAGE
      - AgentMarketplace
  Commercial:
    purpose: Revenue-bearing offers, service products and market channels.
    assets:
      - Doolittles
      - AIForTradies
      - AIForSmallBusiness
      - PocketOps
      - RuntimeReliabilityLayer
      - DomainControlSystem

asset_schema:
  required_fields:
    - id
    - name
    - domain
    - purpose
    - maturity
    - status
    - capabilities
    - dependencies
    - evidence
    - runtime
    - commercial_model
  maturity_values:
    - concept
    - prototype
    - alpha
    - beta
    - production
  status_values:
    - active
    - paused
    - archived
    - blocked
  reality_states:
    - REAL
    - PARTIAL
    - BLOCKED

