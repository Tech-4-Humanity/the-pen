gap_register:
  summary: "Review confirms the architecture is promising but incomplete. The gaps are material and must drive the next build."
  gaps:
    - id: "GAP-001"
      area: "Needs model"
      problem: "Needs are implied, not modelled as first-class objects."
      consequence: "Products can drift into feature lists without a human problem to solve."
      fix: "Create Needs Registry schema and require every product assembly to bind to at least one need."
      priority: "CRITICAL"
    - id: "GAP-002"
      area: "Intent model"
      problem: "Intent exists conceptually but not as a runtime object with required fields."
      consequence: "NEUROPAK cannot reliably route or audit actions."
      fix: "Create intent_object schema and routing contract."
      priority: "CRITICAL"
    - id: "GAP-003"
      area: "Evidence contract"
      problem: "Evidence is listed per layer but not normalised into a ledger schema."
      consequence: "REAL/PARTIAL classification remains manual and inconsistent."
      fix: "Create Reality Ledger evidence contract with typed receipt fields."
      priority: "CRITICAL"
    - id: "GAP-004"
      area: "Runtime schema"
      problem: "No SQL/schema pack exists for Need, Intent, Signal, Consent, Evidence, Outcome and Recovery objects."
      consequence: "Architecture cannot execute."
      fix: "Create integrity_stack_runtime_schema.sql."
      priority: "CRITICAL"
    - id: "GAP-005"
      area: "Product assembly discipline"
      problem: "Assets are mapped but not all are reduced to engines, workflows, datasets or surfaces."
      consequence: "Portfolio sprawl can return."
      fix: "Create product assembly matrix for all major assets."
      priority: "HIGH"
    - id: "GAP-006"
      area: "Economic proof"
      problem: "Revenue paths are named but not tied to unit economics, buyer, price, channel or proof of willingness to pay."
      consequence: "Commercial readiness is overstated."
      fix: "Create economic path object and pricing/commercial proof matrix."
      priority: "HIGH"
    - id: "GAP-007"
      area: "Governance and recovery"
      problem: "GCBAT is defined as oversight but lacks explicit stop/recover/replay procedures."
      consequence: "Unsafe or failed loops cannot be deterministically recovered."
      fix: "Create recovery validation and replay contract."
      priority: "HIGH"
    - id: "GAP-008"
      area: "Telemetry continuity"
      problem: "No telemetry stream proves layer-to-layer continuity."
      consequence: "72h survivability cannot be claimed."
      fix: "Define telemetry events for each layer and heartbeat/survivability checks."
      priority: "HIGH"
    - id: "GAP-009"
      area: "Drive/source ingestion"
      problem: "Google Drive file was referenced but not readable in this chat path."
      consequence: "External source may contain unincorporated architecture or evidence."
      fix: "Fetch/read Drive source in next capable runtime and reconcile into spine."
      priority: "MEDIUM"
    - id: "GAP-010"
      area: "Acceptance criteria"
      problem: "No formal done definition exists for architecture, schema, product, pilot or production."
      consequence: "Outputs can look complete while remaining non-executable."
      fix: "Create acceptance criteria per maturity level: concept, architecture, schema, pilot, prod, REAL."
      priority: "HIGH"

acceptance_criteria:
  concept:
    required: ["need statement", "intended user", "target outcome", "spine layer mapping"]
  architecture:
    required: ["layer mapping", "asset reuse map", "evidence needs", "gap register", "next executable artifact"]
  schema:
    required: ["typed objects", "relationships", "status enum", "ledger fields", "rollback path"]
  pilot:
    required: ["user segment", "intervention", "telemetry", "evidence", "success metric", "commercial assumption"]
  production:
    required: ["runtime deployment", "monitoring", "recovery", "cost gate", "security/consent controls", "operator handover"]
  REAL:
    required: ["runtime receipt", "canonical ledger row", "telemetry continuity", "economic proof", "recovery validation", "72h survivability"]

