    Start from the seven-layer Integrity Stack as the spine: Universal Biological
    Integrity, MyNeuralSignal, ID Exchange, ConsentX, NEUROPAK, Tech4Humanity ecosystem
    guidance, and GCBAT oversight. Treat all portfolio assets as views or assemblies
    attached to that spine. No clarification loop. Continue from posted artefact in
    TML-4PM/the-pen/architecture/AI_FOR_HUMANITY_3_1_INTEGRITY_STACK_SPINE.yaml.
  next_build_targets:
    - "THE_HUMANITY_ATLAS_MASTER_ARCHITECTURE.md"
    - "humanity_atlas_schema.yaml"
    - "integrity_stack_runtime_schema.sql"
    - "tech4humanity_product_assembly_matrix.csv"
