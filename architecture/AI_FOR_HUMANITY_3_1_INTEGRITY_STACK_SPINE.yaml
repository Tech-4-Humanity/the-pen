canonical_alignment:
  canonical_repo: "TML-4PM/the-pen"
  governing_rule: "GLOBAL_RULE.md"
  hierarchy: "GLOBAL_RULE.md > MCP_EXECUTION_CONTRACT.md > ENFORCEMENT_LIVE.md > architecture artefacts"
  execution_rule: "Execute -> Prove -> Distribute -> Monetise -> Recover"
  reality_states:
    allowed: ["REAL", "PARTIAL", "GATED", "BLOCKED"]
    rejected: ["PRETEND", "DRAFT_AS_OUTPUT"]
  minimum_real_requires:
    - "Executed through authorised runtime or Bridge path"
    - "Receipt returned"
    - "Evidence written to canonical table"
    - "State advanced"
    - "Rollback or recovery path declared"
    - "Telemetry continuity present"
    - "Economic pathway or proof attached"
    - "72h survivability proven where claiming production readiness"

integrity_stack:
  summary: >
    The seven-layer Integrity Stack is the spine. Portfolio brands, products,
    research dashboards, atlas views, and agent systems attach as reusable
    views or assemblies against this spine.
  layers:
    - layer: 1
      name: "Universal Biological Integrity"
      abbreviation: "UBI"
      role: "Sensor truth and biological ground truth"
      need_served: "Establish trusted human/context signal before any interpretation or intervention."
      intent: "Capture minimal, consent-linkable biological/contextual evidence with provenance and quality scoring."
      core_question: "What is the human state and can it be trusted?"
      inputs: ["biological signals", "environmental signals", "device signals", "context signals"]
      outputs: ["signal quality", "human state markers", "integrity confidence", "sensor provenance"]
      evidence_required: ["sensor provenance receipt", "signal quality score", "timestamped event record", "data minimisation and consent linkage"]
    - layer: 2
      name: "MyNeuralSignal"
      abbreviation: "MNS"
      role: "Real-time signal integrity and interpretation engine"
      need_served: "Turn raw signals into meaningful, timely and useful indicators."
      intent: "Interpret signal events into candidate needs, risks, opportunities and interventions."
      core_question: "What signal matters now and what does it mean?"
      inputs: ["UBI signal events", "attention markers", "cognitive state markers", "interaction telemetry"]
      outputs: ["interpreted signal", "signal-to-intervention candidates", "confidence score", "drift or anomaly flags"]
      evidence_required: ["interpretation trace", "confidence score", "drift record", "intervention recommendation receipt"]
    - layer: 3
      name: "ID Exchange"
      abbreviation: "IDX"
      role: "Identity, credentials, authority and actor resolution"
      need_served: "Know who or what is acting, and whether they are allowed to act."
      intent: "Bind person, agent, device, organisation and role to each event and decision."
      core_question: "Who or what is acting, and under what authority?"
      inputs: ["person identity", "agent identity", "organisation identity", "device identity", "role and credential assertions"]
      outputs: ["verified actor", "role context", "authority boundary", "credential status"]
      evidence_required: ["identity proof or assertion receipt", "authority scope", "credential freshness", "actor-to-action binding"]
    - layer: 4
      name: "ConsentX"
      abbreviation: "CONSENTX"
      role: "Multi-actor consent, revocation, policy and permission governance"
      need_served: "Protect agency, privacy and lawful purpose before data use or intervention."
      intent: "Determine whether a proposed action is permitted, limited, denied or revoked."
      core_question: "Is this action permitted, for this purpose, at this time?"
      inputs: ["actor identity", "data purpose", "intervention purpose", "guardian or organisational policy", "regulatory constraints"]
      outputs: ["consent grant", "consent denial", "revocation event", "policy constraint", "fallback mode"]
      evidence_required: ["consent receipt", "purpose binding", "revocation path", "fallback classification: FULL | SESSION | NONE"]
    - layer: 5
      name: "NEUROPAK"
      abbreviation: "NEUROPAK"
      role: "Intent orchestration gateway across human signals, agents and machines"
      need_served: "Route need and intent into safe human, agent or machine action."
      intent: "Convert interpreted, consented signals into executable intent objects and route them."
      core_question: "What intent should be routed into which action path?"
      inputs: ["interpreted signal", "identity context", "consent result", "goal or task context", "available agent/machine capabilities"]
      outputs: ["intent object", "routing decision", "agent or machine invocation", "safety gate result"]
      evidence_required: ["intent trace", "routing receipt", "safety gate result", "agent invocation record"]
    - layer: 6
      name: "Tech4Humanity Ecosystem Guidance"
      abbreviation: "T4H"
      role: "Product, research, commercialisation and social-good operating layer"
      need_served: "Select the right product, intervention, research path or commercial route for the human outcome."
      intent: "Assemble reusable assets into a product/workflow/research response and attach economics and impact."
      core_question: "Which product, venture, research path or intervention best serves the human outcome?"
      inputs: ["intent object", "portfolio map", "research evidence", "commercial pathway", "social-good priority"]
      outputs: ["product assembly", "research program link", "commercialisation path", "social-good pathway", "partner or distribution path"]
      evidence_required: ["product assembly receipt", "evidence linkage", "commercial path", "impact metric", "reuse map"]
    - layer: 7
      name: "GCBAT Oversight"
      abbreviation: "GCBAT"
      role: "Governance, audit, standards, safety, ethics and recovery oversight"
      need_served: "Keep the system safe, explainable, recoverable and credible."
      intent: "Audit decisions, classify risk, enforce standards, trigger recovery and stop unsafe loops."
      core_question: "Is the system safe, governed, recoverable, auditable and aligned?"
      inputs: ["all layer receipts", "policy context", "audit events", "standards mappings", "risk signals"]
      outputs: ["audit judgement", "governance status", "risk classification", "recovery directive", "standards alignment"]
      evidence_required: ["ledger entry", "audit trail", "risk classification", "recovery validation", "standards mapping"]

runtime_loop:
