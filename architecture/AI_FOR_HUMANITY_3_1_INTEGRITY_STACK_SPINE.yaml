runtime_loop:
  canonical_formula: "SIGNAL -> SIMULATE -> DECIDE -> ACT -> MEASURE -> LEARN -> GOVERN -> RECOVER"
  steps:
    - step: 1
      verb: "Capture"
      stack_layer: "UBI"
      output: "raw trusted signal event"
    - step: 2
      verb: "Interpret"
      stack_layer: "MyNeuralSignal"
      output: "meaningful signal with confidence"
    - step: 3
      verb: "Bind"
      stack_layer: "ID Exchange"
      output: "actor, role and authority"
    - step: 4
      verb: "Permit"
      stack_layer: "ConsentX"
      output: "purpose-bound consent result"
    - step: 5
      verb: "Route"
      stack_layer: "NEUROPAK"
      output: "intent and action route"
    - step: 6
      verb: "Assemble"
      stack_layer: "Tech4Humanity"
      output: "product/research/intervention path"
    - step: 7
      verb: "Govern"
      stack_layer: "GCBAT"
      output: "audit, risk, recovery and standards status"

