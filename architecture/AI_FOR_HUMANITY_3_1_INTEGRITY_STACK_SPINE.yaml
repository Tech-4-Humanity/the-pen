handover:
  title: "AI for Humanity 3.1 Integrity Stack Spine"
  date: "2026-06-10"
  owner: "Troy Latter"
  repository: "TML-4PM/the-pen"
  status: "PARTIAL"
  classification_reason: >
    Canonical architecture artefact has been posted to the spine repository. Runtime
    deployment, ledger insertion, telemetry continuity, recovery validation, economic
    proof, and 72h survivability remain unproven until executed through Bridge/Supabase.
    Review has also shown gaps in needs, intents, acceptance criteria, runtime binding,
    evidence contract and product assembly discipline. These gaps are now explicit.
  purpose: >
    Lift the AI for Humanity 3.1 / Tech4Humanity portfolio handover into a spine-bound
    architecture anchored to the seven-layer Integrity Stack, reusing existing atlas,
    research, portfolio, signal, machine, people, and social-good assets as views and
    product assemblies.

needs_and_intents:
  summary: >
    The portfolio must stop drifting as a collection of names, diagrams and potential
    products. It needs an executable intent model: who has a need, what signal proves it,
    what consent allows action, which agent or product should respond, what outcome is
    expected, what evidence proves the outcome, and what governance decides whether the
    loop is safe to repeat.
  primary_need: >
    Build a reusable human-outcome operating system where biological, behavioural,
    contextual and organisational signals become governed interventions and measurable
    outcomes without duplicating product logic across every brand.
  primary_intent: >
    Convert AI for Humanity 3.1 from architecture into runtime: a seven-layer integrity
    stack, one graph model, reusable atomic engines, evidence-bound product assemblies,
    and a ledger that can distinguish REAL from PARTIAL/BLOCKED work.
  non_negotiables:
    - "Every product must declare which human need it serves."
    - "Every need must map to at least one signal, one consent path, one intervention path and one measurable outcome."
    - "Every intervention must have identity, authority, consent, evidence, governance and recovery."
    - "No asset is allowed to remain only a brand name; it must resolve to a layer, engine, view, workflow, dataset, product assembly or commercial path."
    - "No product claim is REAL without telemetry, ledger evidence, recovery path and economic proof."
    - "The Integrity Stack is the spine. Humanity Atlas is the navigation surface. Reality Ledger is the truth surface. Research OS is the learning surface."
  intended_users:
    - group: "Families and individuals"
      needs:
        - "less friction in daily life"
        - "better support, coordination and memory"
        - "safe personalised interventions"
        - "agency, dignity and consent"
      intents:
        - "understand what is happening"
        - "coordinate people, tasks and services"
        - "get timely assistance"
        - "track progress without surveillance abuse"
