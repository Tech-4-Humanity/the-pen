handover:
  title: "AI for Humanity 3.1 Integrity Stack Spine"
  date: "2026-06-10"
  owner: "Troy Latter"
  repository: "TML-4PM/the-pen"
  status: "PARTIAL"
  classification_reason: >
    Canonical architecture artefact has been posted to the spine repository. Runtime
    deployment, ledger insertion, telemetry continuity, recovery validation, economic
    proof, and 72h survivability remain unproven until executed through Bridge/Supabase.
  purpose: >
    Lift the AI for Humanity 3.1 / Tech4Humanity portfolio handover into a spine-bound
    architecture anchored to the seven-layer Integrity Stack, reusing existing atlas,
    research, portfolio, signal, machine, people, and social-good assets as views and
    product assemblies.

canonical_alignment:
  canonical_repo: "TML-4PM/the-pen"
  governing_rule: "GLOBAL_RULE.md"
  hierarchy: "GLOBAL_RULE.md > MCP_EXECUTION_CONTRACT.md > ENFORCEMENT_LIVE.md > architecture artefacts"
  execution_rule: "Execute -> Prove -> Distribute -> Monetise -> Recover"
  reality_states:
    allowed: ["REAL", "PARTIAL", "GATED", "BLOCKED"]
    rejected: ["PRETEND", "DRAFT_AS_OUTPUT"]
  minimum_real_requires:
    - "Executed through authorised runtime or Bridge path"
    - "Receipt returned"
    - "Evidence written to canonical table"
    - "State advanced"
    - "Rollback or recovery path declared"
    - "Telemetry continuity present"
    - "Economic pathway or proof attached"
    - "72h survivability proven where claiming production readiness"

integrity_stack:
  summary: >
    The seven-layer Integrity Stack is the spine. Portfolio brands, products,
    research dashboards, atlas views, and agent systems attach as reusable
    views or assemblies against this spine.
  layers:
    - layer: 1
      name: "Universal Biological Integrity"
      abbreviation: "UBI"
      role: "Sensor truth and biological ground truth"
      core_question: "What is the human state and can it be trusted?"
      inputs:
        - "biological signals"
        - "environmental signals"
        - "device signals"
        - "context signals"
      outputs:
        - "signal quality"
        - "human state markers"
        - "integrity confidence"
        - "sensor provenance"
      reusable_assets:
        - "MyNeuralSignal signal intake"
        - "Reading Buddy attention and comprehension signals"
        - "Outcome Ready progress signals"
        - "AI Sweet Spots human-AI fit signals"
        - "Drug Resilience Atlas biological/context signals"
      evidence_required:
        - "sensor provenance receipt"
        - "signal quality score"
        - "timestamped event record"
        - "data minimisation and consent linkage"

    - layer: 2
      name: "MyNeuralSignal"
      abbreviation: "MNS"
      role: "Real-time signal integrity and interpretation engine"
      core_question: "What signal matters now and what does it mean?"
      inputs:
        - "UBI signal events"
        - "attention markers"
        - "cognitive state markers"
        - "interaction telemetry"
      outputs:
        - "interpreted signal"
        - "signal-to-intervention candidates"
        - "confidence score"
        - "drift or anomaly flags"
      reusable_assets:
        - "Synal browser signal surface"
        - "Places attention fabric"
        - "LifeGraph+ longitudinal memory"
        - "Reading Buddy signal-to-intervention chain"
        - "WorkFamilyAI household/work coordination signals"
      evidence_required:
        - "interpretation trace"
        - "confidence score"
        - "drift record"
        - "intervention recommendation receipt"

    - layer: 3
      name: "ID Exchange"
      abbreviation: "IDX"
      role: "Identity, credentials, authority and actor resolution"
      core_question: "Who or what is acting, and under what authority?"
      inputs:
        - "person identity"
        - "agent identity"
        - "organisation identity"
        - "device identity"
        - "role and credential assertions"
      outputs:
        - "verified actor"
        - "role context"
        - "authority boundary"
        - "credential status"
      reusable_assets:
        - "Identity Engine"
        - "Agent Registry"
        - "Human Profile"
        - "Organisation Model"
        - "Reality Ledger actor attribution"
      evidence_required:
        - "identity proof or assertion receipt"
        - "authority scope"
        - "credential freshness"
        - "actor-to-action binding"

    - layer: 4
      name: "ConsentX"
      abbreviation: "CONSENTX"
      role: "Multi-actor consent, revocation, policy and permission governance"
      core_question: "Is this action permitted, for this purpose, at this time?"
      inputs:
        - "actor identity"
        - "data purpose"
        - "intervention purpose"
        - "guardian or organisational policy"
        - "regulatory constraints"
      outputs:
        - "consent grant"
        - "consent denial"
        - "revocation event"
        - "policy constraint"
        - "fallback mode"
      reusable_assets:
        - "Consent Engine"
        - "Trust Layer"
        - "Privacy and sovereignty rules"
        - "Reading Buddy minor/guardian consent"
        - "Outcome Ready participant/provider consent"
      evidence_required:
        - "consent receipt"
        - "purpose binding"
        - "revocation path"
        - "fallback classification: FULL | SESSION | NONE"

    - layer: 5
      name: "NEUROPAK"
      abbreviation: "NEUROPAK"
      role: "Intent orchestration gateway across human signals, agents and machines"
      core_question: "What intent should be routed into which action path?"
      inputs:
        - "interpreted signal"
        - "identity context"
        - "consent result"
        - "goal or task context"
        - "available agent/machine capabilities"
      outputs:
        - "intent object"
        - "routing decision"
        - "agent or machine invocation"
        - "safety gate result"
      reusable_assets:
        - "Intent Engine"
        - "Automation Engine"
        - "HoloOrg role-to-agent routing"
        - "Doolittles listener interpretation"
        - "RATPAK physical autonomy gateway"
      evidence_required:
        - "intent trace"
        - "routing receipt"
        - "safety gate result"
        - "agent invocation record"

    - layer: 6
      name: "Tech4Humanity Ecosystem Guidance"
      abbreviation: "T4H"
      role: "Product, research, commercialisation and social-good operating layer"
      core_question: "Which product, venture, research path or intervention best serves the human outcome?"
      inputs:
        - "intent object"
        - "portfolio map"
        - "research evidence"
        - "commercial pathway"
        - "social-good priority"
      outputs:
        - "product assembly"
        - "research program link"
        - "commercialisation path"
        - "social-good pathway"
        - "partner or distribution path"
      reusable_assets:
        - "Humanity Atlas"
        - "Research OS"
        - "WorkFamilyAI"
        - "AHC"
        - "Outcome Ready"
        - "Reading Buddy"
        - "Synal"
        - "HoloOrg"
        - "Doolittles"
        - "RATPAK"
        - "AI Sweet Spots"
        - "Drug Resilience Atlas"
      evidence_required:
        - "product assembly receipt"
        - "evidence linkage"
        - "commercial path"
        - "impact metric"
        - "reuse map"

    - layer: 7
      name: "GCBAT Oversight"
      abbreviation: "GCBAT"
      role: "Governance, audit, standards, safety, ethics and recovery oversight"
      core_question: "Is the system safe, governed, recoverable, auditable and aligned?"
      inputs:
        - "all layer receipts"
        - "policy context"
        - "audit events"
        - "standards mappings"
        - "risk signals"
      outputs:
        - "audit judgement"
        - "governance status"
        - "risk classification"
        - "recovery directive"
        - "standards alignment"
      reusable_assets:
        - "Reality Ledger"
        - "Research Ledger"
        - "Audit Ledger"
        - "FAR-CAGE"
        - "BCI standards"
        - "National security governance"
        - "Ethical AI governance"
      evidence_required:
        - "ledger entry"
        - "audit trail"
        - "risk classification"
        - "recovery validation"
        - "standards mapping"

