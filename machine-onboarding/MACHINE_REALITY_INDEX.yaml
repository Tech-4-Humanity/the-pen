portfolio:
  source: public.t4h_business_registry
  groups: [CORE, SIGNAL, MISSION, RETAIL, FUN]
  resolution_rule: query live, never assume

clusters:
  source: core.cluster_registry
  active_count: 12
  snapshot: machine-onboarding/canonical/doctrine/CLUSTERS.yaml
  fk_target_warning: |
    INSERT into public.reality_ledger with invalid cluster_id fails with
    sqlstate 23503. Use existing cluster_id or NULL.

canonical_registries:
  systems:         { path: canonical/systems/,             seeded: false }
  businesses:      { path: canonical/businesses/,          seeded: false, source: public.t4h_business_registry }
  products:        { path: canonical/products/,            seeded: false }
  assets:          { path: canonical/assets/,              seeded: false }
  atomic_elements: { path: canonical/atomic-elements/,     seeded: true, count: 6 }
  environments:    { path: canonical/runtime-environments/, seeded: true }
  repos:           { path: canonical/repos/,               seeded: true }
  domains:         { path: canonical/domains/,             seeded: false }
  doctrine:        { path: canonical/doctrine/,            seeded: true, files: [CLUSTERS.yaml, TRAPS.md] }
  receipts:        { path: canonical/receipts/,            seeded: false }
  telemetry:       { path: canonical/telemetry/,           seeded: false }
  relationships:   { path: canonical/relationships/,       seeded: false }

doctrine:
  wave_10: { required_components: 8, rule: any_missing_equals_PARTIAL }
  rdti: { tag_at_creation: true, fields: [is_rd, project_code], rate: 0.435 }
  rls: { rule: all_writes_RLS_enabled }
  archive_policy: { rule: archive_never_delete }
  stamp: { schema: stamp, runway_gate: public.fn_runway_stamp_gate, threshold_secret: STAMP_RUNWAY_THRESHOLD }
  traps_d: { location: canonical/doctrine/TRAPS.md, last_updated: "2026-05-11", entries: 7 }
  acceptance_harness:
    source: machine-onboarding/ACCEPTANCE_HARNESS.sql
    deployed_fn: public.fn_onboarding_acceptance_score()
    invocation: SELECT public.fn_onboarding_acceptance_score()

evidence:
  typed_only: true
  allowed_types: [commit_id, bridge_receipt, api_response, cli_output, hash, repro_steps, deployment_url, telemetry_snapshot, database_result, issue_id, PR_id, url]
  forbidden: [screenshot_only, narrative_only, confidence_without_proof]

trust_states:
  allowed: [REAL, PARTIAL, BLOCKED]
  forbidden: [PRETEND]
  invalid_class: INVALID

onboarding_load_order:
  1: MACHINE_REALITY_INDEX.yaml
  2: PREFLIGHT.md
  3: SESSION_REQUIREMENTS.md
  4: HOUSE_RULES_INTEGRATION.md
  5: EVIDENCE_STANDARD.yaml
  6: BRIDGE_HANDOFF_STANDARD.yaml
  7: ONBOARDING_ACCEPTANCE_TESTS.yaml
  8: canonical/doctrine/CLUSTERS.yaml
  9: canonical/doctrine/TRAPS.md
  10: canonical/atomic-elements/
  11: t4h_business_registry
  12: SELECT public.fn_onboarding_acceptance_score()  # final self-check

relationship_seed:
  - [system, owns, repo]
  - [system, deploys_to, environment]
  - [system, depends_on, system]
  - [business, owns, product]
  - [product, runs_on, system]
  - [product, surfaces_at, domain]
  - [agent, executes, workflow]
  - [workflow, produces, asset]
  - [asset, recorded_in, ledger]
  - [receipt, evidences, execution]
  - [doctrine, governs, system]
  - [ledger_row, belongs_to, cluster]
