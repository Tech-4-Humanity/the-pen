    top_level_payload_for: [troy-lambda-deploy, cfn-deployer, forge]
  supabase:
    S1:
      project: lzfgigiyqpuuxslsygjt
      role: all_writes
      region: ap-southeast-2
      hosts:
        - public.reality_ledger
        - public.fn_onboarding_acceptance_score
