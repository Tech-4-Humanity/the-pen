  domains:        canonical/domains/
  doctrine:       canonical/doctrine/
  receipts:       canonical/receipts/
  telemetry:      canonical/telemetry/
  relationships:  canonical/relationships/

# ──────────────────────────────────────────────────────────────────
# DOCTRINE BINDINGS
# ──────────────────────────────────────────────────────────────────
doctrine:
  wave_10:
    required_components: 8
    rule: any_missing_equals_PARTIAL
  rdti:
    tag_at_creation: true
    fields: [is_rd, project_code]
    rate: 0.435
  rls:
    rule: all_writes_RLS_enabled
  archive_policy:
    rule: archive_never_delete
  stamp:
    schema: stamp
    runway_gate: public.fn_runway_stamp_gate
    threshold_secret: STAMP_RUNWAY_THRESHOLD

# ──────────────────────────────────────────────────────────────────
# EVIDENCE STANDARD (compressed — full file at EVIDENCE_STANDARD.yaml)
# ──────────────────────────────────────────────────────────────────
evidence:
  typed_only: true
  allowed_types:
    - commit_id
    - bridge_receipt
    - api_response
    - cli_output
    - hash
    - repro_steps
    - deployment_url
    - telemetry_snapshot
    - database_result
    - issue_id
    - PR_id
    - url
  forbidden:
    - screenshot_only
    - narrative_only
    - confidence_without_proof

# ──────────────────────────────────────────────────────────────────
# TRUST STATES
# ──────────────────────────────────────────────────────────────────
trust_states:
  allowed: [REAL, PARTIAL, BLOCKED]
  forbidden: [PRETEND]
  invalid_class: INVALID  # for false REAL claims

# ──────────────────────────────────────────────────────────────────
# LOAD ORDER FOR ONBOARDING
# ──────────────────────────────────────────────────────────────────
onboarding_load_order:
  1: MACHINE_REALITY_INDEX.yaml  # this file
  2: SESSION_REQUIREMENTS.md
  3: HOUSE_RULES_INTEGRATION.md
  4: EVIDENCE_STANDARD.yaml
  5: BRIDGE_HANDOFF_STANDARD.yaml
  6: ONBOARDING_ACCEPTANCE_TESTS.yaml
  7: canonical/doctrine/  # active doctrine versions
  8: canonical/systems/   # only those relevant to current task
  9: t4h_business_registry  # live portfolio resolution

# ──────────────────────────────────────────────────────────────────
# RELATIONSHIP GRAPH SEED
# ──────────────────────────────────────────────────────────────────
relationship_seed:
  - [system, owns, repo]
  - [system, deploys_to, environment]
  - [system, depends_on, system]
  - [business, owns, product]
  - [product, runs_on, system]
  - [product, surfaces_at, domain]
  - [agent, executes, workflow]
  - [workflow, produces, asset]
  - [asset, recorded_in, ledger]
  - [receipt, evidences, execution]
  - [doctrine, governs, system]
