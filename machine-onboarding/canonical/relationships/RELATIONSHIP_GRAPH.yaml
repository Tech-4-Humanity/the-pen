runtime_rules:
  - REL-RULE-001
    rule: every REAL object must connect to at least one governing or validating object

  - REL-RULE-002
    rule: every telemetry-enabled object must bind to a telemetry stream

  - REL-RULE-003
    rule: every recovery-capable object must bind to a recovery path

  - REL-RULE-004
    rule: canonical systems must connect to canonical repositories

  - REL-RULE-005
    rule: monetisable systems must connect to economic units

  - REL-RULE-006
    rule: doctrine objects must govern at least one executable or reporting asset

  - REL-RULE-007
    rule: orphaned objects automatically downgrade to PARTIAL

future_runtime_targets:
  - live graph traversal engine
