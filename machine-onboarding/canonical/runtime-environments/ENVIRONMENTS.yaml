# RUNTIME ENVIRONMENT REGISTRY
# Authoritative for environment trust, write permissions, criticality, rollback rules.

meta:
  version: "1.0"
  status: ACTIVE
  canonical_owner: The Pen
  last_updated: "2026-05-11"

environments:

  prod:
    environment_id: ENV-PROD-001
    name: production
    criticality: HIGH
    write_access: gated
    requires_authorisation: true
    validation_required: true
    rollback_required: true
    linked_systems: [the-pen, mcp-bridge, command-centre, supabase-S1]
    linked_supabase: lzfgigiyqpuuxslsygjt
    notes: All canonical writes land here. Even SELECTs against prod must be efficient and rate-aware.

  dev:
    environment_id: ENV-DEV-001
    name: development
    criticality: LOW
    write_access: open
    requires_authorisation: false
    validation_required: false
    rollback_required: false
    notes: Sandbox for experimental work. Nothing dev-only should be claimed as REAL in any cross-environment context.

  staging:
    environment_id: ENV-STG-001
    name: staging
    criticality: MEDIUM
    write_access: gated
    requires_authorisation: false
    validation_required: true
    rollback_required: true
    notes: Pre-prod gate. Required for any deployment that will hit prod within the same session.

  sandbox:
    environment_id: ENV-SBX-001
    name: sandbox
    criticality: LOW
    write_access: open
    requires_authorisation: false
    validation_required: false
    notes: Machine-only scratch. Not user-visible. Used by recovery loops for replay verification.

  restricted:
    environment_id: ENV-RST-001
    name: restricted
    criticality: HIGH
    write_access: forbidden_without_explicit_grant
    requires_authorisation: true
    validation_required: true
    rollback_required: true
    notes: Contains credentials, secrets, regulated data. Reading requires audit log entry. Writing requires explicit sole_director authorisation.

rules:
  - Environment trust is NEVER inferred from URL alone.
  - Cross-environment writes require an explicit ledger row tagged with both source and target environment.
  - Dev → prod promotion requires staging pass.
  - Prod → dev backflow requires data-classification check (no PII/credentials).
  - Restricted environment access requires audit log entry; missing log = ledger row classified BLOCKED.

bridge_handoff_target_validation:
  rule: |
    BRIDGE_HANDOFF_STANDARD.yaml.required_fields.environment_target.must_match
    is this registry. Any value not in {prod, dev, staging, sandbox, restricted}
    fails handoff validation.
