  relationship_policy: explicit_edges_over_implicit_assumptions
  core:
    - Tech4Humanity
    - WorkFamilyAI
    - AugmentedHumanityCoach
    - HoloOrg
  signal_layer:
    - GCBAT
    - ConsentX
    - FARCAGE
    - MyNeuralSignal
    - NEUROPAK
    - RATPAK
    - LifeGraphPlus
    - AIOlympics
  mission_layer:
    - MissionCritical
    - OutcomeReady
    - SmartPark
